#cloud-config
# DeCloud DHT VM Cloud-Init Configuration — Role Layer
# Runs a libp2p Kademlia DHT node for peer discovery,
# key-value storage, and GossipSub event propagation.
# Version: 8.2
#
# Changes from 8.1:
#   - P3.2.4 cutover: switch DHT_ADVERTISE_IP and DHT_BOOTSTRAP_PEERS to
#     watcher-managed environment file. Stripped from dht.env; new
#     EnvironmentFile=-/etc/decloud-dht/environment on decloud-dht.service.
#     Statics-only dht.env path remains for everything else.
#   - Added /etc/decloud-dht/variable-scopes.conf with rendered scope policy
#     (__VARIABLE_SCOPES_BLOCK__ — populated by P1.6 resolver at render time).
#   - Added /etc/decloud-dht/environment stub for systemd to load before the
#     watcher's first tick.
#   - Added initial env-fetch runcmd (mirrors relay P3.1.4) so the env file
#     starts with a real generation hash, not "initial".
#   - Added watcher timer enable runcmd (mirrors relay P3.1.4 + hotfix path).
#   - DHT_LISTEN_PORT and DHT_API_PORT switched from literal values to
#     __DHT_LISTEN_PORT__ / __DHT_API_PORT__ placeholders; orchestrator
#     resolves via DefaultValue (4001/5080).
#   - dht-metadata.json version bumped 8.1 → 8.2.
#
# Changes from 8.0:
#   - P0.9 identity-fetch standardization: retry ceiling extended from
#     2 minutes (24 × 5s) to 10 minutes (60 × 10s). Log message format
#     normalized to match BlockStore and Relay (counter visible every
#     retry). No format change to the identity file on disk.
#
# Changes from 7.0:
#   - Stripped base content. Now a pure role layer; composes with
#     base-templates/base-system-mesh.yaml at template-seed time via
#     TemplateComposer. The composed result is structurally equivalent
#     to v7.0 of this file.
#   - Removed (now in base-system-mesh.yaml):
#       * scalars: hostname, manage_etc_hosts, package_update/upgrade,
#         disable_root, ssh_pwauth, __SSH_AUTHORIZED_KEYS_BLOCK__
#       * bootcmd entries (machine-id, snapd/LXD mask, qemu-guest-agent)
#       * packages list (8 packages)
#       * write_files: /etc/decloud/wg-mesh.env, wg-mesh-watchdog.{service,
#         timer,sh}, wg-quick@wg-mesh.service.d/override.conf
#       * runcmd: qemu-guest-agent symlink + start
#   - Kept (role-specific):
#       * write_files: /etc/decloud-dht/dht.env, dht-metadata.json,
#         nginx site config, decloud-dht.service, dashboard service,
#         bootstrap-poll service
#       * runcmd: identity fetch, artifact fetch, wg-config-fetch
#         invocation, daemon-reload, nginx + service starts, log echo
#
# This file is NOT deployed standalone. Composed with base-system-mesh.yaml.

write_files:
  # Statics-only env file. Dynamics (DHT_ADVERTISE_IP, DHT_BOOTSTRAP_PEERS)
  # live in /etc/decloud-dht/environment, written by decloud-env-watcher.sh.
  # Both files are loaded by decloud-dht.service via EnvironmentFile=
  # directives; later directives override earlier on key collision (systemd
  # convention) — the watcher-managed file wins for any overlapping key.
  - path: /etc/decloud-dht/dht.env
    permissions: '0644'
    content: |
      DHT_LISTEN_PORT=__DHT_LISTEN_PORT__
      DHT_API_PORT=__DHT_API_PORT__
      DHT_DATA_DIR=/var/lib/decloud-dht
      DECLOUD_NODE_ID=__NODE_ID__
      DECLOUD_VM_ID=__VM_ID__
      DECLOUD_REGION=__DHT_REGION__
      ORCHESTRATOR_URL=__ORCHESTRATOR_URL__
      HOST_MACHINE_ID=__HOST_MACHINE_ID__
      DHT_MESH_MIN_PEERS=1
      DHT_MESH_STALENESS_SEC=300

  # Watcher scope policy (P3.2.4). Rendered by VariableScopesBlockResolver
  # from template.Variables — produces 2 lines for DHT:
  #   DHT_ADVERTISE_IP=restart
  #   DHT_BOOTSTRAP_PEERS=noop
  - path: /etc/decloud-dht/variable-scopes.conf
    permissions: '0644'
    content: |
      __VARIABLE_SCOPES_BLOCK__

  # Watcher-managed environment file. Stub here so systemd's
  # EnvironmentFile=-/etc/decloud-dht/environment doesn't fail before the
  # watcher's first tick (the - prefix already makes it tolerant to absence,
  # but a populated file with a known generation marker keeps the watcher's
  # initial diff symmetric).
  - path: /etc/decloud-dht/environment
    permissions: '0640'
    content: |
      ENV_GENERATION=initial

  - path: /etc/decloud/dht-metadata.json
    permissions: '0644'
    content: |
      {
        "node_id": "__NODE_ID__",
        "vm_id": "__VM_ID__",
        "vm_name": "__VM_NAME__",
        "region": "__DHT_REGION__",
        "listen_port": 4001,
        "api_port": 5080,
        "advertise_ip": "__WG_TUNNEL_IP__",
        "wg_tunnel_ip": "__WG_TUNNEL_IP__",
        "created_at": "__TIMESTAMP__",
        "version": "8.2",
        "connectivity": "wireguard-mesh"
      }

  - path: /etc/nginx/sites-available/dht-proxy
    permissions: '0644'
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          server_name _;

          location = /nginx-health {
              return 200 "OK\n";
              add_header Content-Type text/plain;
          }

          location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 5s;
              proxy_read_timeout 35s;
          }
      }

  - path: /etc/systemd/system/decloud-dht.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud DHT Node (libp2p Kademlia)
      After=network-online.target wg-quick@wg-mesh.service
      Wants=network-online.target wg-quick@wg-mesh.service

      [Service]
      Type=simple
      User=root
      # Two env files: statics from cloud-init render, dynamics from watcher.
      # systemd merges in order; later directives override earlier on key
      # collision (no overlap by design).
      EnvironmentFile=/etc/decloud-dht/dht.env
      EnvironmentFile=-/etc/decloud-dht/environment
      ExecStart=/usr/local/bin/dht-node
      Restart=always
      RestartSec=5
      ProtectSystem=strict
      ReadWritePaths=/var/lib/decloud-dht
      NoNewPrivileges=true

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/decloud-dht-dashboard.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud DHT Dashboard Server
      After=decloud-dht.service nginx.service
      Wants=decloud-dht.service nginx.service

      [Service]
      Type=simple
      EnvironmentFile=/etc/decloud-dht/dht.env
      ExecStart=/usr/bin/python3 /opt/decloud-dht/dht-dashboard.py
      Restart=always
      RestartSec=5
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/decloud-dht-bootstrap-poll.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud DHT Bootstrap Peer Polling
      After=decloud-dht.service network-online.target
      Wants=decloud-dht.service network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/dht-bootstrap-poll.sh
      Restart=always
      RestartSec=15
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

runcmd:
  # ── DHT identity from NodeAgent obligation state ─────────────────────────
  # Fetches persistent Ed25519 keypair — same peer ID survives VM replacement.
  # P0.9 standardization: 60 attempts × 10s = 10 min ceiling. Hard-fail on
  # final timeout. Logs every retry so the wait is visible in journalctl.
  - |
    GATEWAY=$(ip route 2>/dev/null | awk '/default/ {print $3; exit}')
    LOG="/var/log/decloud-dht-bootstrap.log"
    log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] dht-identity: $*" | tee -a "$LOG"; }
    log "Fetching DHT identity from NodeAgent obligation state..."
    ATTEMPTS=0
    MAX_ATTEMPTS=60
    STATE=""
    while [ $ATTEMPTS -lt $MAX_ATTEMPTS ] && [ -z "$STATE" ]; do
      STATE=$(curl -sf --max-time 5 \
          "http://${GATEWAY}:5100/api/obligations/dht/state" 2>/dev/null || echo "")
      if [ -z "$STATE" ]; then
        ATTEMPTS=$((ATTEMPTS+1))
        log "Not ready — retrying in 10s (attempt ${ATTEMPTS}/${MAX_ATTEMPTS})"
        sleep 10
      fi
    done
    if [ -z "$STATE" ]; then
      log "FATAL: DHT identity unavailable after 10 minutes — aborting cloud-init"
      exit 1
    fi
    mkdir -p /var/lib/decloud-dht && chmod 700 /var/lib/decloud-dht
    echo "$STATE" | jq -r '.ed25519PrivateKeyBase64' | base64 -d \
        > /var/lib/decloud-dht/identity.key
    chmod 600 /var/lib/decloud-dht/identity.key
    PEER_ID=$(echo "$STATE" | jq -r '.peerId // "unknown"')
    log "DHT identity loaded (peerId: ${PEER_ID})"

  # ── Artifacts from local cache (pre-fetched by node agent before deploy) ──
  # curl -f (not -sf) inside set -e: any download failure halts cloud-init
  # immediately with a clear error rather than silently producing a missing file.
  - |
    set -e
    mkdir -p /opt/decloud-dht/static /var/lib/decloud-dht
    echo "[artifacts] Fetching required artifacts from node agent cache..."

    curl -f --max-time 120 ${ARTIFACT_URL:dht-node} -o /usr/local/bin/dht-node
    echo "${ARTIFACT_SHA256:dht-node}  /usr/local/bin/dht-node" | sha256sum -c -
    chmod +x /usr/local/bin/dht-node
    echo "[artifacts] ✓ dht-node ($(wc -c < /usr/local/bin/dht-node) bytes)"

    curl -f --max-time 30 ${ARTIFACT_URL:wg-mesh-enroll} -o /usr/local/bin/wg-mesh-enroll.sh
    chmod +x /usr/local/bin/wg-mesh-enroll.sh
    echo "[artifacts] ✓ wg-mesh-enroll"

    curl -f --max-time 30 ${ARTIFACT_URL:wg-config-fetch} -o /usr/local/bin/wg-config-fetch.sh
    chmod +x /usr/local/bin/wg-config-fetch.sh
    echo "[artifacts] ✓ wg-config-fetch"

    curl -f --max-time 30 ${ARTIFACT_URL:dht-health-check} -o /usr/local/bin/dht-health-check.sh
    chmod +x /usr/local/bin/dht-health-check.sh
    echo "[artifacts] ✓ dht-health-check"

    curl -f --max-time 30 ${ARTIFACT_URL:dht-notify-ready} -o /usr/local/bin/dht-notify-ready.sh
    chmod +x /usr/local/bin/dht-notify-ready.sh
    echo "[artifacts] ✓ dht-notify-ready"

    curl -f --max-time 30 ${ARTIFACT_URL:dht-bootstrap-poll} -o /usr/local/bin/dht-bootstrap-poll.sh
    chmod +x /usr/local/bin/dht-bootstrap-poll.sh
    echo "[artifacts] ✓ dht-bootstrap-poll"

    curl -f --max-time 30 ${ARTIFACT_URL:dht-dashboard} -o /opt/decloud-dht/dht-dashboard.py
    chmod +x /opt/decloud-dht/dht-dashboard.py
    echo "[artifacts] ✓ dht-dashboard"

    curl -f --max-time 30 ${ARTIFACT_URL:dht-dashboard-html} -o /opt/decloud-dht/static/dashboard.html
    curl -f --max-time 30 ${ARTIFACT_URL:dht-dashboard-css}  -o /opt/decloud-dht/static/dashboard.css
    curl -f --max-time 30 ${ARTIFACT_URL:dht-dashboard-js}   -o /opt/decloud-dht/static/dashboard.js
    echo "[artifacts] All artifacts fetched successfully"

  # ── WireGuard mesh enrollment ─────────────────────────────────────────────
  - |
    export DECLOUD_ROLE=dht
    export NODE_ID=__NODE_ID__
    export VM_ID=__VM_ID__
    /usr/local/bin/wg-config-fetch.sh

  - systemctl daemon-reload

  # ── Initial environment-fetch (P3.2.4) ───────────────────────────────────
  # Write a real generation hash so the watcher starts from a known baseline.
  # Best-effort: if the endpoint isn't reachable (NodeAgent still starting),
  # the stub written by write_files keeps "ENV_GENERATION=initial" until the
  # watcher's first tick succeeds.
  - |
    GATEWAY=$(ip route 2>/dev/null | awk '/default/ {print $3; exit}')
    mkdir -p /etc/decloud-dht
    ENV_RESP=$(curl -sf --max-time 5 \
        "http://${GATEWAY}:5100/api/obligations/dht/environment" 2>/dev/null || echo "")
    if [ -n "$ENV_RESP" ]; then
      GEN=$(echo "$ENV_RESP" | jq -r '.generation // "initial"')
      DHT_ADVERTISE_IP=$(echo "$ENV_RESP" | jq -r '.values.DHT_ADVERTISE_IP // ""')
      DHT_BOOTSTRAP_PEERS=$(echo "$ENV_RESP" | jq -r '.values.DHT_BOOTSTRAP_PEERS // ""')
      cat > /etc/decloud-dht/environment <<EOF
    ENV_GENERATION=${GEN}
    DHT_ADVERTISE_IP=${DHT_ADVERTISE_IP}
    DHT_BOOTSTRAP_PEERS=${DHT_BOOTSTRAP_PEERS}
    EOF
      chmod 0640 /etc/decloud-dht/environment
      echo "[env] Initial environment generation: ${GEN}"
    else
      echo "[env] Environment endpoint not yet reachable — keeping stub; watcher will update on first tick"
    fi

  - ln -sf /etc/nginx/sites-available/dht-proxy /etc/nginx/sites-enabled/
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t
  - systemctl enable nginx && systemctl restart nginx

  - systemctl enable decloud-dht && systemctl start decloud-dht
  - systemctl enable decloud-dht-dashboard && systemctl start decloud-dht-dashboard
  - systemctl enable decloud-dht-bootstrap-poll && systemctl start decloud-dht-bootstrap-poll
  - systemctl enable wg-mesh-watchdog.timer && systemctl start wg-mesh-watchdog.timer

  # ── Enable env-watcher timer (P3.2.4) ────────────────────────────────────
  # Fires decloud-env-watcher.sh dht every 60s starting 30s after boot.
  # mkdir -p guard required: timers.target.wants/ may not pre-exist on
  # Debian 12 cloud images (P3.1.6 lesson).
  - mkdir -p /etc/systemd/system/timers.target.wants
  - ln -sf /etc/systemd/system/decloud-env-watcher@.timer /etc/systemd/system/timers.target.wants/decloud-env-watcher@dht.timer  - systemctl start decloud-env-watcher@dht.timer

  - 'echo "DHT node __VM_ID__ ready at $(date) — region: __DHT_REGION__, tunnel: __WG_TUNNEL_IP__" >> /var/log/decloud-dht-bootstrap.log'

final_message: "DeCloud DHT Node __VM_NAME__ is ready!"
