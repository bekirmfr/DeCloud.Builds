#cloud-config
# DeCloud Block Store VM Cloud-Init Configuration — Role Layer
# Runs a libp2p BitSwap block store node for content-addressed storage.
# Version: 4.1
#
# Changes from 4.0:
#   - P0.9 identity-fetch standardization: cloud-init now fetches obligation
#     state and writes /var/lib/decloud-blockstore/identity.key before the
#     binary starts. 60 attempts × 10s = 10 min ceiling, hard-fail on timeout.
#     **Coordinated binary change required:** blockstore-node v4.1+ reads the
#     file at startup; no HTTP client, no self-create. Both halves land in
#     one commit.
#   - Identity file format: raw 32-byte Ed25519 seed (matches DHT pattern).
#     Binary expands to full 64-byte key via stded25519.NewKeyFromSeed.

# Changes from 3.0:
#   - Stripped base content. Now a pure role layer; composes with
#     base-templates/base-system-mesh.yaml at template-seed time via
#     TemplateComposer. The composed result is structurally equivalent
#     to v3.0 of this file.
#   - Removed (now in base-system-mesh.yaml):
#       * scalars: hostname, manage_etc_hosts, package_update/upgrade,
#         disable_root, ssh_pwauth, __SSH_AUTHORIZED_KEYS_BLOCK__
#       * bootcmd entries (machine-id, snapd/LXD mask, qemu-guest-agent)
#       * packages list (8 packages)
#       * write_files: /etc/decloud/wg-mesh.env, wg-mesh-watchdog.{service,
#         timer,sh}, wg-quick@wg-mesh.service.d/override.conf
#       * runcmd: qemu-guest-agent symlink + start
#   - Kept (role-specific):
#       * write_files: /etc/decloud-blockstore/blockstore.env,
#         blockstore-metadata.json, nginx site config,
#         decloud-blockstore.service, dashboard service,
#         bootstrap-poll service
#       * runcmd: artifact fetch, wg-config-fetch invocation,
#         daemon-reload, nginx + service starts, log echo
#   - **(v4.0)** No identity-fetch runcmd. Binary self-loaded identity via
#     loadOrCreateIdentity() against NodeAgent obligation state at runtime.
#   - **(v4.1, P0.9)** Identity-fetch runcmd added; binary became file-reader.
#     See "Changes from 4.0" above.
#
# This file is NOT deployed standalone. Composed with base-system-mesh.yaml.

write_files:
  - path: /etc/decloud-blockstore/blockstore.env
    permissions: '0640'
    content: |
      BLOCKSTORE_LISTEN_PORT=__BLOCKSTORE_LISTEN_PORT__
      BLOCKSTORE_API_PORT=__BLOCKSTORE_API_PORT__
      BLOCKSTORE_ADVERTISE_IP=__BLOCKSTORE_ADVERTISE_IP__
      # BLOCKSTORE_STORAGE_BYTES intentionally omitted — binary fetches from NodeAgent obligation state
      BLOCKSTORE_NODE_ID=__NODE_ID__
      BLOCKSTORE_VM_ID=__VM_ID__
      ORCHESTRATOR_URL=__ORCHESTRATOR_URL__
      BLOCKSTORE_BOOTSTRAP_PEERS=__BLOCKSTORE_BOOTSTRAP_PEERS__
      HOST_MACHINE_ID=__HOST_MACHINE_ID__

  - path: /etc/decloud/blockstore-metadata.json
    permissions: '0644'
    content: |
      {
        "node_id": "__NODE_ID__",
        "vm_id": "__VM_ID__",
        "vm_name": "__VM_NAME__",
        "region": "__DHT_REGION__",
        "listen_port": __BLOCKSTORE_LISTEN_PORT__,
        "api_port": __BLOCKSTORE_API_PORT__,
        "created_at": "__TIMESTAMP__",
        "version": "4.1",
        "connectivity": "wireguard-mesh"
      }

  - path: /etc/nginx/sites-available/blockstore-proxy
    permissions: '0644'
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          server_name _;

          location = /nginx-health {
              return 200 "OK\n";
              add_header Content-Type text/plain;
          }

          location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 5s;
              proxy_read_timeout 35s;
          }

          location ~ ^/(health|stats)$ {
              proxy_pass http://127.0.0.1:5090;
              proxy_set_header Host $host;
          }
      }

  - path: /etc/systemd/system/decloud-blockstore.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud Block Store Node
      After=network-online.target wg-quick@wg-mesh.service
      Wants=network-online.target wg-quick@wg-mesh.service

      [Service]
      User=root
      EnvironmentFile=/etc/decloud-blockstore/blockstore.env
      ExecStart=/usr/local/bin/blockstore-node
      Restart=always
      RestartSec=5
      StandardOutput=journal
      StandardError=journal
      LimitNOFILE=65536

      # Hardening
      ProtectSystem=strict
      ReadWritePaths=/var/lib/decloud-blockstore
      NoNewPrivileges=true

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/decloud-blockstore-dashboard.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud Block Store Dashboard Server
      After=decloud-blockstore.service nginx.service
      Wants=decloud-blockstore.service nginx.service

      [Service]
      Type=simple
      EnvironmentFile=/etc/decloud-blockstore/blockstore.env
      ExecStart=/usr/bin/python3 /opt/decloud-blockstore/blockstore-dashboard.py
      Restart=always
      RestartSec=5
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/decloud-blockstore-bootstrap-poll.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud Block Store Bootstrap Peer Polling
      After=decloud-blockstore.service network-online.target
      Wants=decloud-blockstore.service network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/blockstore-bootstrap-poll.sh
      Restart=always
      RestartSec=15
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

runcmd:
  # ── BlockStore identity from NodeAgent obligation state ──────────────────
  # P0.9 standardization: cloud-init writes the identity file BEFORE the
  # binary starts. blockstore-node binary reads /var/lib/decloud-blockstore/
  # identity.key at startup; no HTTP client in binary, no self-create.
  # 60 attempts × 10s = 10 min ceiling. Hard-fail on final timeout.
  #
  # Format: raw 32-byte Ed25519 seed (decoded from obligation state's
  # ed25519PrivateKeyBase64). Binary expands to full 64-byte key at read time.
  - |
    GATEWAY=$(ip route 2>/dev/null | awk '/default/ {print $3; exit}')
    LOG="/var/log/decloud-blockstore-bootstrap.log"
    log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] blockstore-identity: $*" | tee -a "$LOG"; }
    log "Fetching BlockStore identity from NodeAgent obligation state..."
    ATTEMPTS=0
    MAX_ATTEMPTS=60
    STATE=""
    while [ $ATTEMPTS -lt $MAX_ATTEMPTS ] && [ -z "$STATE" ]; do
      STATE=$(curl -sf --max-time 5 \
          "http://${GATEWAY}:5100/api/obligations/blockstore/state" 2>/dev/null || echo "")
      if [ -z "$STATE" ]; then
        ATTEMPTS=$((ATTEMPTS+1))
        log "Not ready — retrying in 10s (attempt ${ATTEMPTS}/${MAX_ATTEMPTS})"
        sleep 10
      fi
    done
    if [ -z "$STATE" ]; then
      log "FATAL: BlockStore identity unavailable after 10 minutes — aborting cloud-init"
      exit 1
    fi
    mkdir -p /var/lib/decloud-blockstore && chmod 700 /var/lib/decloud-blockstore
    echo "$STATE" | jq -r '.ed25519PrivateKeyBase64' | base64 -d \
        > /var/lib/decloud-blockstore/identity.key
    chmod 600 /var/lib/decloud-blockstore/identity.key
    PEER_ID=$(echo "$STATE" | jq -r '.peerId // "unknown"')
    log "BlockStore identity loaded (peerId: ${PEER_ID})"

  # ── Artifacts from local cache (pre-fetched by node agent before deploy) ──
  # ${ARTIFACT_URL:name} is substituted by SystemVmReconciler.SubstituteArtifactVariables
  # to http://192.168.122.1:5100/api/artifacts/{sha256} before the VM is created.
  # ${ARTIFACT_SHA256:name} is substituted to the hex digest for verification.
  # curl -f (not -sf) inside set -e: any download failure halts cloud-init
  # immediately with a clear error rather than silently producing a missing file.
  - |
    set -e
    mkdir -p /opt/decloud-blockstore/static /var/lib/decloud-blockstore
    echo "[artifacts] Fetching required artifacts from node agent cache..."

    curl -f --max-time 120 ${ARTIFACT_URL:blockstore-node} -o /usr/local/bin/blockstore-node
    echo "${ARTIFACT_SHA256:blockstore-node}  /usr/local/bin/blockstore-node" | sha256sum -c -
    chmod +x /usr/local/bin/blockstore-node
    echo "[artifacts] ✓ blockstore-node ($(wc -c < /usr/local/bin/blockstore-node) bytes)"

    curl -f --max-time 30 ${ARTIFACT_URL:wg-mesh-enroll} -o /usr/local/bin/wg-mesh-enroll.sh
    chmod +x /usr/local/bin/wg-mesh-enroll.sh
    echo "[artifacts] ✓ wg-mesh-enroll"

    curl -f --max-time 30 ${ARTIFACT_URL:wg-config-fetch} -o /usr/local/bin/wg-config-fetch.sh
    chmod +x /usr/local/bin/wg-config-fetch.sh
    echo "[artifacts] ✓ wg-config-fetch"

    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-health-check} -o /usr/local/bin/blockstore-health-check.sh
    chmod +x /usr/local/bin/blockstore-health-check.sh
    echo "[artifacts] ✓ blockstore-health-check"

    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-notify-ready} -o /usr/local/bin/blockstore-notify-ready.sh
    chmod +x /usr/local/bin/blockstore-notify-ready.sh
    echo "[artifacts] ✓ blockstore-notify-ready"

    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-bootstrap-poll} -o /usr/local/bin/blockstore-bootstrap-poll.sh
    chmod +x /usr/local/bin/blockstore-bootstrap-poll.sh
    echo "[artifacts] ✓ blockstore-bootstrap-poll"

    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-dashboard} -o /opt/decloud-blockstore/blockstore-dashboard.py
    chmod +x /opt/decloud-blockstore/blockstore-dashboard.py
    echo "[artifacts] ✓ blockstore-dashboard"

    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-dashboard-html} -o /opt/decloud-blockstore/static/dashboard.html
    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-dashboard-css}  -o /opt/decloud-blockstore/static/dashboard.css
    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-dashboard-js}   -o /opt/decloud-blockstore/static/dashboard.js
    echo "[artifacts] All artifacts fetched successfully"

  # ── WireGuard mesh enrollment ─────────────────────────────────────────────
  - |
    export DECLOUD_ROLE=blockstore
    export NODE_ID=__NODE_ID__
    export VM_ID=__VM_ID__
    /usr/local/bin/wg-config-fetch.sh

  - systemctl daemon-reload

  - ln -sf /etc/nginx/sites-available/blockstore-proxy /etc/nginx/sites-enabled/
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t
  - systemctl enable nginx && systemctl restart nginx

  - systemctl enable decloud-blockstore && systemctl start decloud-blockstore
  - systemctl enable decloud-blockstore-dashboard && systemctl start decloud-blockstore-dashboard
  - systemctl enable decloud-blockstore-bootstrap-poll && systemctl start decloud-blockstore-bootstrap-poll
  - systemctl enable wg-mesh-watchdog.timer && systemctl start wg-mesh-watchdog.timer

  - 'echo "BlockStore __VM_ID__ ready at $(date) — tunnel: __WG_TUNNEL_IP__" >> /var/log/blockstore-bootstrap.log'

final_message: "DeCloud Block Store Node __VM_NAME__ is ready!"
