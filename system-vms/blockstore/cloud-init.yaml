#cloud-config
# DeCloud Block Store VM Cloud-Init Configuration — Role Layer
# Runs a libp2p BitSwap block store for content-addressed storage.
# Version: 4.3
#
# Changes from 4.2:
#   - Restored the canonical v4.1 identity-fetch block. v4.2 mistakenly
#     introduced /api/obligations/blockstore/identity (endpoint that does
#     not exist on the NodeAgent) and a fabricated retry-loop shape; this
#     produced 60 silent 404 retries followed by exit 1 on every fresh
#     deploy after the binaries/v1.1.0 cutover (the v1.0.0 binary's
#     loadOrCreateIdentity fallback masked the latent inconsistency in
#     prior deploys, but v1.1.0 removed that fallback per P0.9 design).
#     Endpoint corrected to /api/obligations/blockstore/state per P0.9
#     standardization across all three roles. Code shape re-aligned with
#     DHT (line-for-line same retry loop).
#
# Changes from 4.1:
#   - P3.3.4 cutover: switch BLOCKSTORE_ADVERTISE_IP and BLOCKSTORE_BOOTSTRAP_PEERS
#     to watcher-managed environment file. Stripped from blockstore.env; new
#     EnvironmentFile=-/etc/decloud-blockstore/environment on
#     decloud-blockstore.service. Statics-only blockstore.env path remains
#     for everything else.
#   - Added /etc/decloud-blockstore/variable-scopes.conf with rendered scope
#     policy (__VARIABLE_SCOPES_BLOCK__ — populated by P1.6 resolver at render).
#   - Added /etc/decloud-blockstore/environment stub for systemd to load
#     before the watcher's first tick.
#   - Added initial env-fetch runcmd (mirrors relay P3.1.4 / DHT P3.2.4) so
#     the env file starts with a real generation hash, not "initial".
#   - Added watcher timer enable runcmd with mkdir -p guard (Debian 12
#     timers.target.wants/ may not pre-exist — P3.1.6 lesson).
#   - Fixed metadata region placeholder __DHT_REGION__ → __BLOCKSTORE_REGION__
#     (was a copy-paste bug in v4.1; not caught earlier because the renderer
#     ran with strictValidation:false; P3.3.1 declares BLOCKSTORE_REGION as
#     Static).
#   - decloud-blockstore-dashboard.service: added second EnvironmentFile=
#     and PartOf=decloud-blockstore.service so the dashboard sees the
#     watcher's BLOCKSTORE_ADVERTISE_IP value AND restarts in lockstep
#     with the role service (the dashboard process loads env once at start).
#   - blockstore-metadata.json version bumped 4.1 → 4.2.
#
# Changes from 4.0:
#   - P0.9 identity-fetch standardization: identity-fetch runcmd added;
#     binary became file-reader (loadOrCreateIdentity → loadIdentity).
#     v1.0.0 binary's self-create branch is dead code; v1.1.0 (cut
#     2026-05-05) removes it.
#
# This file is NOT deployed standalone. Composed with base-system-mesh.yaml.

write_files:
  # Statics-only env file. Dynamics (BLOCKSTORE_ADVERTISE_IP,
  # BLOCKSTORE_BOOTSTRAP_PEERS) live in /etc/decloud-blockstore/environment,
  # written by decloud-env-watcher.sh. Both files are loaded by
  # decloud-blockstore.service via EnvironmentFile= directives; later
  # directives override earlier on key collision (systemd convention) —
  # the watcher-managed file wins for any overlapping key.
  - path: /etc/decloud-blockstore/blockstore.env
    permissions: '0640'
    content: |
      BLOCKSTORE_LISTEN_PORT=__BLOCKSTORE_LISTEN_PORT__
      BLOCKSTORE_API_PORT=__BLOCKSTORE_API_PORT__
      # BLOCKSTORE_STORAGE_BYTES intentionally omitted — binary fetches from NodeAgent obligation state
      BLOCKSTORE_NODE_ID=__NODE_ID__
      BLOCKSTORE_VM_ID=__VM_ID__
      ORCHESTRATOR_URL=__ORCHESTRATOR_URL__
      HOST_MACHINE_ID=__HOST_MACHINE_ID__

  # Watcher scope policy (P3.3.4). Rendered by VariableScopesBlockResolver
  # from template.Variables — produces 2 lines for BlockStore:
  #   BLOCKSTORE_ADVERTISE_IP=restart
  #   BLOCKSTORE_BOOTSTRAP_PEERS=noop
  - path: /etc/decloud-blockstore/variable-scopes.conf
    permissions: '0644'
    content: |
      __VARIABLE_SCOPES_BLOCK__

  # Watcher-managed environment file. Stub here so systemd's
  # EnvironmentFile=-/etc/decloud-blockstore/environment doesn't fail
  # before the watcher's first tick (the - prefix already makes it
  # tolerant to absence, but a populated file with a known generation
  # marker keeps the watcher's initial diff symmetric).
  - path: /etc/decloud-blockstore/environment
    permissions: '0640'
    content: |
      ENV_GENERATION=initial

  - path: /etc/decloud/blockstore-metadata.json
    permissions: '0644'
    content: |
      {
        "node_id": "__NODE_ID__",
        "vm_id": "__VM_ID__",
        "vm_name": "__VM_NAME__",
        "region": "__BLOCKSTORE_REGION__",
        "listen_port": __BLOCKSTORE_LISTEN_PORT__,
        "api_port": __BLOCKSTORE_API_PORT__,
        "created_at": "__TIMESTAMP__",
        "version": "4.3",
        "connectivity": "wireguard-mesh"
      }

  - path: /etc/nginx/sites-available/blockstore-proxy
    permissions: '0644'
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          server_name _;

          location = /nginx-health {
              return 200 "OK\n";
              add_header Content-Type text/plain;
          }

          location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 5s;
              proxy_read_timeout 35s;
          }

          location ~ ^/(health|stats)$ {
              proxy_pass http://127.0.0.1:5090;
              proxy_set_header Host $host;
          }
      }

  - path: /etc/systemd/system/decloud-blockstore.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud Block Store Node
      After=network-online.target wg-quick@wg-mesh.service
      Wants=network-online.target wg-quick@wg-mesh.service

      [Service]
      User=root
      # Two env files: statics from cloud-init render, dynamics from watcher.
      # systemd merges in order; later directives override earlier on key
      # collision (no overlap by design).
      EnvironmentFile=/etc/decloud-blockstore/blockstore.env
      EnvironmentFile=-/etc/decloud-blockstore/environment
      ExecStart=/usr/local/bin/blockstore-node
      Restart=always
      RestartSec=5
      StandardOutput=journal
      StandardError=journal
      LimitNOFILE=65536

      # Hardening
      ProtectSystem=strict
      ReadWritePaths=/var/lib/decloud-blockstore
      NoNewPrivileges=true

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/decloud-blockstore-dashboard.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud Block Store Dashboard Server
      After=decloud-blockstore.service nginx.service
      Wants=decloud-blockstore.service nginx.service
      # PartOf cascade: when the watcher restarts decloud-blockstore.service
      # due to BLOCKSTORE_ADVERTISE_IP change, restart the dashboard too so
      # its module-level _SUBSTITUTIONS dict picks up the new value. Without
      # PartOf the dashboard would show stale advertise IP until next reboot.
      PartOf=decloud-blockstore.service

      [Service]
      Type=simple
      # Same two-file pattern as the role service — the dashboard reads
      # BLOCKSTORE_ADVERTISE_IP from os.environ at module load.
      EnvironmentFile=/etc/decloud-blockstore/blockstore.env
      EnvironmentFile=-/etc/decloud-blockstore/environment
      ExecStart=/usr/bin/python3 /opt/decloud-blockstore/blockstore-dashboard.py
      Restart=always
      RestartSec=5
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/decloud-blockstore-bootstrap-poll.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud Block Store Bootstrap Peer Polling
      After=decloud-blockstore.service network-online.target
      Wants=decloud-blockstore.service network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/blockstore-bootstrap-poll.sh
      Restart=always
      RestartSec=15
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

runcmd:
  # ── BlockStore identity from NodeAgent obligation state ──────────────────
  # P0.9 standardization: cloud-init writes the identity file BEFORE the
  # binary starts. blockstore-node binary reads /var/lib/decloud-blockstore/
  # identity.key at startup; no HTTP client in binary, no self-create.
  # 60 attempts × 10s = 10 min ceiling. Hard-fail on final timeout.
  #
  # Format: raw 32-byte Ed25519 seed (decoded from obligation state's
  # ed25519PrivateKeyBase64). Binary expands to full 64-byte key at read time.
  - |
    GATEWAY=$(ip route 2>/dev/null | awk '/default/ {print $3; exit}')
    LOG="/var/log/decloud-blockstore-bootstrap.log"
    log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] blockstore-identity: $*" | tee -a "$LOG"; }
    log "Fetching BlockStore identity from NodeAgent obligation state..."
    ATTEMPTS=0
    MAX_ATTEMPTS=60
    STATE=""
    while [ $ATTEMPTS -lt $MAX_ATTEMPTS ] && [ -z "$STATE" ]; do
      STATE=$(curl -sf --max-time 5 \
          "http://${GATEWAY}:5100/api/obligations/blockstore/state" 2>/dev/null || echo "")
      if [ -z "$STATE" ]; then
        ATTEMPTS=$((ATTEMPTS+1))
        log "Not ready — retrying in 10s (attempt ${ATTEMPTS}/${MAX_ATTEMPTS})"
        sleep 10
      fi
    done
    if [ -z "$STATE" ]; then
      log "FATAL: BlockStore identity unavailable after 10 minutes — aborting cloud-init"
      exit 1
    fi
    mkdir -p /var/lib/decloud-blockstore && chmod 700 /var/lib/decloud-blockstore
    echo "$STATE" | jq -r '.ed25519PrivateKeyBase64' | base64 -d \
        > /var/lib/decloud-blockstore/identity.key
    chmod 600 /var/lib/decloud-blockstore/identity.key
    PEER_ID=$(echo "$STATE" | jq -r '.peerId // "unknown"')
    log "BlockStore identity loaded (peerId: ${PEER_ID})"

  # ── Artifacts from local cache (pre-fetched by node agent before deploy) ──
  # ${ARTIFACT_URL:name} is substituted by SystemVmReconciler.SubstituteArtifactVariables
  # to http://192.168.122.1:5100/api/artifacts/{sha256} before the VM is created.
  # ${ARTIFACT_SHA256:name} is substituted to the hex digest for verification.
  # curl -f (not -sf) inside set -e: any download failure halts cloud-init
  # immediately with a clear error rather than silently producing a missing file.
  - |
    set -e
    mkdir -p /opt/decloud-blockstore/static /var/lib/decloud-blockstore
    echo "[artifacts] Fetching required artifacts from node agent cache..."

    curl -f --max-time 120 ${ARTIFACT_URL:blockstore-node} -o /usr/local/bin/blockstore-node
    echo "${ARTIFACT_SHA256:blockstore-node}  /usr/local/bin/blockstore-node" | sha256sum -c -
    chmod +x /usr/local/bin/blockstore-node
    echo "[artifacts] ✓ blockstore-node ($(wc -c < /usr/local/bin/blockstore-node) bytes)"

    curl -f --max-time 30 ${ARTIFACT_URL:wg-mesh-enroll} -o /usr/local/bin/wg-mesh-enroll.sh
    chmod +x /usr/local/bin/wg-mesh-enroll.sh
    echo "[artifacts] ✓ wg-mesh-enroll"

    curl -f --max-time 30 ${ARTIFACT_URL:wg-config-fetch} -o /usr/local/bin/wg-config-fetch.sh
    chmod +x /usr/local/bin/wg-config-fetch.sh
    echo "[artifacts] ✓ wg-config-fetch"

    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-health-check} -o /usr/local/bin/blockstore-health-check.sh
    chmod +x /usr/local/bin/blockstore-health-check.sh
    echo "[artifacts] ✓ blockstore-health-check"

    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-notify-ready} -o /usr/local/bin/blockstore-notify-ready.sh
    chmod +x /usr/local/bin/blockstore-notify-ready.sh
    echo "[artifacts] ✓ blockstore-notify-ready"

    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-bootstrap-poll} -o /usr/local/bin/blockstore-bootstrap-poll.sh
    chmod +x /usr/local/bin/blockstore-bootstrap-poll.sh
    echo "[artifacts] ✓ blockstore-bootstrap-poll"

    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-dashboard} -o /opt/decloud-blockstore/blockstore-dashboard.py
    chmod +x /opt/decloud-blockstore/blockstore-dashboard.py
    echo "[artifacts] ✓ blockstore-dashboard"

    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-dashboard-html} -o /opt/decloud-blockstore/static/dashboard.html
    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-dashboard-css}  -o /opt/decloud-blockstore/static/dashboard.css
    curl -f --max-time 30 ${ARTIFACT_URL:blockstore-dashboard-js}   -o /opt/decloud-blockstore/static/dashboard.js
    echo "[artifacts] All artifacts fetched successfully"

  # ── WireGuard mesh enrollment ─────────────────────────────────────────────
  - |
    export DECLOUD_ROLE=blockstore
    export NODE_ID=__NODE_ID__
    export VM_ID=__VM_ID__
    /usr/local/bin/wg-config-fetch.sh

  - systemctl daemon-reload

  # ── Initial environment-fetch (P3.3.4) ───────────────────────────────────
  # Write a real generation hash so the watcher starts from a known baseline.
  # Best-effort: if the endpoint isn't reachable (NodeAgent still starting),
  # the stub written by write_files keeps "ENV_GENERATION=initial" until the
  # watcher's first tick succeeds.
  - |
    GATEWAY=$(ip route 2>/dev/null | awk '/default/ {print $3; exit}')
    mkdir -p /etc/decloud-blockstore
    ENV_RESP=$(curl -sf --max-time 5 \
        "http://${GATEWAY}:5100/api/obligations/blockstore/environment" 2>/dev/null || echo "")
    if [ -n "$ENV_RESP" ]; then
      GEN=$(echo "$ENV_RESP" | jq -r '.generation // "initial"')
      BLOCKSTORE_ADVERTISE_IP=$(echo "$ENV_RESP" | jq -r '.values.BLOCKSTORE_ADVERTISE_IP // ""')
      BLOCKSTORE_BOOTSTRAP_PEERS=$(echo "$ENV_RESP" | jq -r '.values.BLOCKSTORE_BOOTSTRAP_PEERS // ""')
      cat > /etc/decloud-blockstore/environment <<EOF
    ENV_GENERATION=${GEN}
    BLOCKSTORE_ADVERTISE_IP=${BLOCKSTORE_ADVERTISE_IP}
    BLOCKSTORE_BOOTSTRAP_PEERS=${BLOCKSTORE_BOOTSTRAP_PEERS}
    EOF
      chmod 0640 /etc/decloud-blockstore/environment
      echo "[env] Initial environment generation: ${GEN}"
    else
      echo "[env] Environment endpoint not yet reachable — keeping stub; watcher will update on first tick"
    fi

  # ── nginx + service starts ───────────────────────────────────────────────
  - ln -sf /etc/nginx/sites-available/blockstore-proxy /etc/nginx/sites-enabled/
  - rm -f /etc/nginx/sites-enabled/default
  - systemctl reload nginx
  - systemctl enable decloud-blockstore.service && systemctl start decloud-blockstore.service
  - systemctl enable decloud-blockstore-dashboard.service && systemctl start decloud-blockstore-dashboard.service
  - systemctl enable decloud-blockstore-bootstrap-poll.service && systemctl start decloud-blockstore-bootstrap-poll.service

  # ── wg-mesh-watchdog timer (from base-system-mesh.yaml) ──────────────────
  - systemctl enable wg-mesh-watchdog.timer && systemctl start wg-mesh-watchdog.timer

  # ── Enable env-watcher timer (P3.3.4) ────────────────────────────────────
  # Fires decloud-env-watcher.sh blockstore every 60s starting 30s after boot.
  # mkdir -p guard required: timers.target.wants/ may not pre-exist on
  # Debian 12 cloud images (P3.1.6 lesson). Single-line ln -sf — NO backslash
  # continuation (P3.2.5 Bug 1 lesson).
  - mkdir -p /etc/systemd/system/timers.target.wants
  - ln -sf /etc/systemd/system/decloud-env-watcher@.timer /etc/systemd/system/timers.target.wants/decloud-env-watcher@blockstore.timer
  - systemctl start decloud-env-watcher@blockstore.timer

  - 'echo "BlockStore node __VM_ID__ ready at $(date) — region: __BLOCKSTORE_REGION__, tunnel: __WG_TUNNEL_IP__" >> /var/log/decloud-blockstore-bootstrap.log'