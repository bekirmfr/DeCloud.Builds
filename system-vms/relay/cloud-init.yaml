#cloud-config
# DeCloud Relay VM Cloud-Init Configuration — Role Layer
# Version: 6.2
#
# Changes from 6.0:
#   - P0.9 identity-fetch standardization. Removed:
#       * write_files: /etc/wireguard/wg-relay-server.conf (label-baked
#         __WIREGUARD_PRIVATE_KEY__ placeholder)
#       * write_files: /etc/wireguard/private.key, /etc/wireguard/public.key
#         (label-baked WG keypair)
#       * write_files: /etc/decloud/relay-subnet (label-baked __RELAY_SUBNET__)
#       * runcmd: sed-rewrite-from-obligation-state block with fallback
#         to label-baked key
#     Added:
#       * runcmd: identity-fetch block matching DHT/BlockStore pattern
#         (60×10s = 10 min ceiling, hard-fail on timeout, no fallback).
#         Writes private.key, public.key, relay-subnet from obligation state,
#         then renders wg-relay-server.conf via heredoc.
#   - relay-metadata.json: still rendered with __RELAY_SUBNET__ and
#     __WIREGUARD_PUBLIC_KEY__ at cloud-init render time (option 1 from §2
#     decision log) — documentary metadata, not source of truth. The runtime
#     /etc/wireguard/* and /etc/decloud/relay-subnet files are authoritative.
#
# Changes from 6.1:
#   - P3.1.4 environment + watcher infra. Added:
#       * write_files: /etc/decloud-relay/variable-scopes.conf
#         (rendered from __VARIABLE_SCOPES_BLOCK__ at orchestrator render time)
#       * write_files: /etc/decloud-relay/environment (stub; watcher overwrites)
#       * decloud-relay-api.service, decloud-relay-http-proxy.service:
#         EnvironmentFile=-/etc/decloud-relay/environment (optional, Phase 4 will
#         refactor relay-api.py to read env vars; for now baked-in values still used)
#       * runcmd: initial environment-fetch from /api/obligations/relay/environment
#       * runcmd: watcher artifact install + decloud-env-watcher@relay.timer enable
#
# Changes from 5.1:
#   - Stripped base content. Now a pure role layer; composes with
#     base-templates/base-system.yaml at template-seed time via
#     TemplateComposer. The composed result is structurally equivalent
#     to v5.1 of this file.
#   - Removed (now in base-system.yaml):
#       * scalars: hostname, manage_etc_hosts, package_update/upgrade,
#         disable_root, ssh_pwauth, __SSH_AUTHORIZED_KEYS_BLOCK__
#       * bootcmd entries (machine-id, snapd/LXD mask, qemu-guest-agent)
#       * 8 of 9 packages (fail2ban stays — relay-only)
#       * runcmd: qemu-guest-agent symlink + start
#   - Hostname standardization: source v5.1 had `hostname: __VM_NAME__`;
#     base has `hostname: __HOSTNAME__`. This role layer no longer
#     declares `hostname` at all (base wins, since role is silent).
#     Other __VM_NAME__ references (final_message, log lines, metadata JSON)
#     stay as-is — they refer to VM identity, not hostname.
#   - Kept (role-specific):
#       * fail2ban package
#       * WireGuard server config + identity files + subnet file
#       * nginx site config (HTTP-proxy + relay-API multiplexing)
#       * fail2ban jail config
#       * wg-quick@wg-relay-server systemd override
#       * 4 decloud-relay-* systemd units
#       * relay-register-poll.sh script
#       * relay-metadata.json
#       * Full relay-specific runcmd: IP forwarding, UFW disable,
#         WG config rewrite from obligation state (current sed-gymnastics
#         preserved — P0.9 standardization will replace this), wg-quick
#         start, route config, artifact fetch, all service enables,
#         log echoes
#
# This file is NOT deployed standalone. Composed with base-system.yaml.
#
# Note: relay does NOT compose with base-system-mesh.yaml — relay does not
# participate in the WireGuard mesh as a peer. It IS the mesh hub for its
# subnet, using wg-quick@wg-relay-server (not wg-quick@wg-mesh).

packages:
  - fail2ban

write_files:
  # NOTE (P0.9): /etc/wireguard/wg-relay-server.conf, /etc/wireguard/private.key,
  # /etc/wireguard/public.key, and /etc/decloud/relay-subnet are NOT baked in
  # via cloud-init substitution. They are written by the identity-fetch runcmd
  # block below from the NodeAgent obligation state's authoritative values,
  # then wg-quick is started. Eliminates label-baked secrets and the format
  # fragility of base64 in cloud-init labels.

  # ── Environment directory, scope file, and env stub ───────────────────────
  # Created at render time; watcher and systemd service both read from here.
  # /etc/decloud-relay/variable-scopes.conf — rendered from __VARIABLE_SCOPES_BLOCK__
  #   (relay has no Dynamic variables in Phase 3, so this file contains only a
  #    comment line; the watcher sees it, reads an empty scope map, and exits cleanly)
  # /etc/decloud-relay/environment — stub written here so systemd's EnvironmentFile=
  #   succeeds even before the watcher's first tick overwrites it with real content.
  - path: /etc/decloud-relay/variable-scopes.conf
    permissions: '0644'
    content: |
      __VARIABLE_SCOPES_BLOCK__

  - path: /etc/decloud-relay/environment
    permissions: '0640'
    content: |
      ENV_GENERATION=initial

  # Nginx reverse proxy configuration
  # Port 80 multiplexes two services based on Host header:
  #   relay-* hostname or bare IP  → relay-api:8080 (dashboard)
  #   any other hostname           → http-proxy:8081 (CGNAT VM traffic)
  - path: /etc/nginx/sites-available/relay-proxy
    permissions: '0644'
    content: |
      # WebSocket upgrade header mapping
      map $http_upgrade $connection_upgrade {
          default upgrade;
          '' close;
      }

      server {
          listen 80 default_server;
          listen [::]:80 default_server;

          server_name _;

          location /health {
              return 200 "OK\n";
              add_header Content-Type text/plain;
          }

          location /static/ {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_cache_valid 200 1h;
              add_header Cache-Control "public, max-age=3600";
          }

          location /api/relay/ {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location = / {
              if ($host ~* "^[0-9.]+$|^relay-") {
                  proxy_pass http://127.0.0.1:8080;
                  break;
              }
              proxy_pass http://127.0.0.1:8081;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 90s;
              proxy_read_timeout 90s;
          }

          location / {
              proxy_pass http://127.0.0.1:8081;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 90s;
              proxy_read_timeout 90s;
              proxy_buffering off;
              proxy_request_buffering off;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
          }
      }

  - path: /etc/fail2ban/jail.d/relay.conf
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      port = 22
      maxretry = 3
      bantime = 3600
      findtime = 600

      [nginx-botsearch]
      enabled = true
      port = 80
      maxretry = 2
      bantime = 86400
      findtime = 60

      [nginx-limit-req]
      enabled = true
      port = 80
      maxretry = 20
      bantime = 600
      findtime = 60
      logpath = /var/log/nginx/error.log

  - path: /etc/systemd/system/wg-quick@wg-relay-server.service.d/restart.conf
    permissions: '0644'
    content: |
      [Service]
      Restart=on-failure
      RestartSec=10

  - path: /etc/systemd/system/decloud-relay-api.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud Relay Management API
      After=network.target wg-quick@wg-relay-server.service
      Wants=wg-quick@wg-relay-server.service

      [Service]
      Type=simple
      Restart=always
      RestartSec=5
      # EnvironmentFile is optional here (relay-api.py still reads baked-in values
      # in Phase 3). Present so Phase 4 relay-api.py refactor can source env vars
      # without a YAML change.
      EnvironmentFile=-/etc/decloud-relay/environment
      WorkingDirectory=/opt/decloud-relay
      ExecStart=/usr/bin/python3 /opt/decloud-relay/relay-api.py
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/decloud-relay-http-proxy.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud Relay HTTP Proxy
      After=network.target wg-quick@wg-relay-server.service nginx.service
      Wants=wg-quick@wg-relay-server.service nginx.service

      [Service]
      Type=simple
      Restart=always
      RestartSec=5
      EnvironmentFile=-/etc/decloud-relay/environment
      WorkingDirectory=/opt/decloud-relay
      ExecStart=/usr/bin/python3 /opt/decloud-relay/http-proxy.py
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  # NAT callback service.
  # notify-nat-ready.sh is delivered via the artifact pipeline and is NOT
  # processed by cloud-init variable substitution. RELAY_VM_ID and
  # HOST_MACHINE_ID are injected here (this unit IS in write_files and
  # DOES get substitution) so the script can authenticate against the
  # node agent without needing double-underscore placeholder processing.
  - path: /etc/systemd/system/decloud-relay-nat-callback.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud Relay NAT Configuration Callback
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      Environment="RELAY_VM_ID=__VM_ID__"
      Environment="HOST_MACHINE_ID=__HOST_MACHINE_ID__"
      ExecStartPre=/bin/bash -c 'if [ -f /var/lib/decloud/nat-callback-complete ]; then echo "NAT callback already completed"; exit 0; fi'
      ExecStart=/usr/local/bin/notify-nat-ready.sh
      ExecStartPost=/bin/bash -c 'mkdir -p /var/lib/decloud && touch /var/lib/decloud/nat-callback-complete'
      RemainAfterExit=yes
      StandardOutput=journal
      StandardError=journal
      Restart=on-failure
      RestartSec=5s
      StartLimitBurst=3
      TimeoutStartSec=120s

      [Install]
      WantedBy=multi-user.target

  # Orchestrator registration polling service.
  # Retries every 30s until HTTP 200, then exits cleanly — systemd will not
  # restart a clean exit. Requires nat-callback so the relay is fully
  # operational (NAT rules up, port 51820 reachable) before registering.
  - path: /etc/systemd/system/decloud-relay-register.service
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud Relay Orchestrator Registration
      After=decloud-relay-nat-callback.service decloud-relay-api.service
      Requires=decloud-relay-nat-callback.service

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/relay-register-poll.sh
      Restart=on-failure
      RestartSec=30s
      StartLimitInterval=0
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  # Registration polling script — loops until orchestrator confirms (HTTP 200).
  # Auth: HMAC-SHA256(wg_private_key, nodeId:vmId) — mirrors dht-bootstrap-poll.sh.
  - path: /usr/local/bin/relay-register-poll.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      ORCHESTRATOR_URL="__ORCHESTRATOR_URL__"
      NODE_ID="__NODE_ID__"
      RELAY_VM_ID="__VM_ID__"
      PUBLIC_IP="__PUBLIC_IP__"
      # Runtime fallback — if cloud-init substitution produced empty IP (ipify.org
      # unreachable at node agent startup), discover it inside the VM instead.
      if [ -z "$PUBLIC_IP" ]; then
          PUBLIC_IP=$(curl -sf --max-time 5 https://api.ipify.org 2>/dev/null \
                   || curl -sf --max-time 5 https://ifconfig.me 2>/dev/null \
                   || ip route get 1.1.1.1 2>/dev/null | awk '{print $7; exit}' \
                   || echo "")
          [ -n "$PUBLIC_IP" ] && log "Runtime IP discovery: $PUBLIC_IP" \
                               || log "WARNING: Could not discover public IP — endpoint will be empty"
      fi

      # Read from files written by runcmd obligation state fetch —
      # guaranteed to reflect the actual running keypair and subnet.
      PUBLIC_KEY=$(cat /etc/wireguard/public.key | tr -d '\n')
      RELAY_SUBNET=$(cat /etc/decloud/relay-subnet | tr -d '\n')
      TUNNEL_IP="10.20.${RELAY_SUBNET}.254"
      MARKER="/var/lib/decloud/relay-registered"
      LOG="/var/log/decloud-relay-register.log"

      log() { echo "[$(date +'%Y-%m-%d %H:%M:%S')] relay-register: $*" | tee -a "$LOG"; }

      if [ -f "$MARKER" ]; then
          log "Already registered — exiting"
          exit 0
      fi

      WIREGUARD_PRIVATE_KEY=$(cat /etc/wireguard/private.key | tr -d '\n')
      MESSAGE="${NODE_ID}:${RELAY_VM_ID}"
      TOKEN=$(echo -n "$MESSAGE" | openssl dgst -sha256 -hmac "$WIREGUARD_PRIVATE_KEY" -binary | base64)

      log "Starting orchestrator registration poll (will retry until success)..."

      while true; do
          HTTP=$(curl -s -o /tmp/relay-register-resp.json -w "%{http_code}" \
              -X POST "$ORCHESTRATOR_URL/api/relay/register-callback" \
              -H "Content-Type: application/json" \
              -H "X-Relay-Token: $TOKEN" \
              -d "{
                  \"nodeId\": \"$NODE_ID\",
                  \"relayVmId\": \"$RELAY_VM_ID\",
                  \"wireGuardPublicKey\": \"$PUBLIC_KEY\",
                  \"wireGuardEndpoint\": \"$PUBLIC_IP:51820\",
                  \"relaySubnet\": $RELAY_SUBNET,
                  \"tunnelIp\": \"$TUNNEL_IP\"
              }" \
              --max-time 15 2>/dev/null || echo "000")

          if [ "$HTTP" = "200" ]; then
              log "Registration successful (HTTP 200)"
              mkdir -p "$(dirname "$MARKER")"
              echo "Registered at $(date)" > "$MARKER"
              logger -t decloud-relay "Orchestrator registration successful"
              exit 0
          elif [ "$HTTP" = "401" ] || [ "$HTTP" = "403" ]; then
              log "Authentication failed (HTTP $HTTP) — token misconfiguration, exiting"
              exit 1
          else
              log "Orchestrator unreachable (HTTP ${HTTP:-timeout}) — retrying in 30s"
              sleep 30
          fi
      done

  - path: /etc/decloud/relay-metadata.json
    permissions: '0644'
    content: |
      {
        "node_id": "__NODE_ID__",
        "relay_id": "__VM_ID__",
        "vm_id": "__VM_ID__",
        "relay_name": "__VM_NAME__",
        "region": "__RELAY_REGION__",
        "relay_subnet": __RELAY_SUBNET__,
        "tunnel_ip": "10.20.__RELAY_SUBNET__.254",
        "max_capacity": __RELAY_CAPACITY__,
        "wireguard_endpoint": "__PUBLIC_IP__:51820",
        "wireguard_public_key": "__WIREGUARD_PUBLIC_KEY__",
        "orchestrator_public_key": "__ORCHESTRATOR_PUBLIC_KEY__",
        "created_at": "__TIMESTAMP__",
        "version": "6.2"
      }

runcmd:
  # Enable IP forwarding (required for relay functionality)
  - echo "net.ipv4.ip_forward=1" >> /etc/sysctl.conf
  - echo "net.ipv6.conf.all.forwarding=1" >> /etc/sysctl.conf
  - sysctl -p

  # UFW would interfere with WireGuard NAT rules — disable it
  - ufw disable || true
  - systemctl stop ufw || true
  - systemctl disable ufw || true

  # ── Relay identity from NodeAgent obligation state ──────────────────────
  # P0.9 standardization. Cloud-init fetches obligation state, writes WG keypair
  # + subnet files, renders wg-relay-server.conf from those values, then starts
  # wg-quick. No label-baked secrets, no sed-rewrite, no fallback path.
  # 60 attempts × 10s = 10 min ceiling. Hard-fail on final timeout.
  #
  # The orchestrator placeholders (__ORCHESTRATOR_*) inside the heredoc are
  # resolved by CloudInitRenderer at render time, before this script runs.
  # Bash variable references inside the heredoc ($DEFAULT_IFACE, $5) are
  # escaped to defer expansion to runtime when wg-quick reads the config.
  - |
    GATEWAY=$(ip route 2>/dev/null | awk '/default/ {print $3; exit}')
    LOG="/var/log/decloud-relay-bootstrap.log"
    log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] relay-identity: $*" | tee -a "$LOG"; }
    log "Fetching Relay identity from NodeAgent obligation state..."
    ATTEMPTS=0
    MAX_ATTEMPTS=60
    STATE=""
    while [ $ATTEMPTS -lt $MAX_ATTEMPTS ] && [ -z "$STATE" ]; do
      STATE=$(curl -sf --max-time 5 \
          "http://${GATEWAY}:5100/api/obligations/relay/state" 2>/dev/null || echo "")
      if [ -z "$STATE" ]; then
        ATTEMPTS=$((ATTEMPTS+1))
        log "Not ready — retrying in 10s (attempt ${ATTEMPTS}/${MAX_ATTEMPTS})"
        sleep 10
      fi
    done
    if [ -z "$STATE" ]; then
      log "FATAL: Relay identity unavailable after 10 minutes — aborting cloud-init"
      exit 1
    fi
    WG_PRIV=$(echo "$STATE" | jq -r '.wireGuardPrivateKey // empty')
    WG_PUB=$(echo "$STATE"  | jq -r '.wireGuardPublicKey  // empty')
    SUBNET=$(echo "$STATE"  | jq -r '.relaySubnet         // empty')
    if [ -z "$WG_PRIV" ] || [ -z "$WG_PUB" ] || [ -z "$SUBNET" ]; then
      log "FATAL: obligation state missing required fields (wireGuardPrivateKey/PublicKey/relaySubnet)"
      exit 1
    fi
    if echo "$SUBNET" | grep -qE '^[0-9]+$'; then
      SUBNET_OCTET="$SUBNET"
    else
      SUBNET_OCTET=$(echo "$SUBNET" | cut -d'.' -f3)
    fi
    if [ -z "$SUBNET_OCTET" ]; then
      log "FATAL: could not derive subnet octet from '$SUBNET'"
      exit 1
    fi
    mkdir -p /etc/wireguard /etc/decloud
    printf '%s\n' "$WG_PRIV"      > /etc/wireguard/private.key
    printf '%s\n' "$WG_PUB"       > /etc/wireguard/public.key
    printf '%s\n' "$SUBNET_OCTET" > /etc/decloud/relay-subnet
    chmod 600 /etc/wireguard/private.key
    chmod 644 /etc/wireguard/public.key /etc/decloud/relay-subnet
    cat > /etc/wireguard/wg-relay-server.conf << EOF
    [Interface]
    Address = 10.20.${SUBNET_OCTET}.254/24
    PrivateKey = ${WG_PRIV}
    ListenPort = 51820
    MTU = 1220

    PostUp = iptables -A FORWARD -i wg-relay-server -j ACCEPT
    PostUp = iptables -A FORWARD -o wg-relay-server -j ACCEPT
    PostUp = bash -c 'DEFAULT_IFACE=\$(ip route | grep default | awk "{print \\\$5}"); iptables -t nat -A POSTROUTING -o \$DEFAULT_IFACE -j MASQUERADE'
    PostUp = iptables -A INPUT -i wg-relay-server -p tcp --dport 22 -j DROP
    PreDown = iptables -D FORWARD -i wg-relay-server -j ACCEPT
    PreDown = iptables -D FORWARD -o wg-relay-server -j ACCEPT
    PreDown = bash -c 'DEFAULT_IFACE=\$(ip route | grep default | awk "{print \\\$5}"); iptables -t nat -D POSTROUTING -o \$DEFAULT_IFACE -j MASQUERADE'
    PreDown = iptables -D INPUT -i wg-relay-server -p tcp --dport 22 -j DROP

    [Peer]
    PublicKey = __ORCHESTRATOR_PUBLIC_KEY__
    Endpoint = __ORCHESTRATOR_IP__:__ORCHESTRATOR_PORT__
    AllowedIPs = 10.20.0.1/32
    PersistentKeepalive = 25
    EOF
    chmod 600 /etc/wireguard/wg-relay-server.conf
    log "Relay identity loaded (pubkey: $(printf '%.16s' "$WG_PUB")..., subnet: ${SUBNET_OCTET})"

  - systemctl enable wg-quick@wg-relay-server
  - systemctl start wg-quick@wg-relay-server

  - wg show wg-relay-server | grep -A 5 "__ORCHESTRATOR_PUBLIC_KEY__" || echo "WARNING - Orchestrator peer not found!"

  - |
    RELAY_SUBNET=$(cat /etc/decloud/relay-subnet 2>/dev/null | tr -d '\n' || echo "__RELAY_SUBNET__")
    echo "Configuring routes for relay subnet ${RELAY_SUBNET}..."
    ip route add 10.20.${RELAY_SUBNET}.0/24 dev wg-relay-server 2>/dev/null || echo "Route already exists"
    mkdir -p /etc/network
    echo "10.20.${RELAY_SUBNET}.0/24 dev wg-relay-server scope link" >> /etc/network/routes 2>/dev/null || true
    echo "Routes configured for subnet 10.20.${RELAY_SUBNET}.0/24"

  - |
    for i in $(seq 1 10); do
      if wg show wg-relay-server &>/dev/null; then
        echo "WireGuard interface ready"
        break
      fi
      sleep 2
    done

  # ── Artifacts from local cache (pre-fetched by node agent before deploy) ──
  # curl -f (not -sf) inside set -e: any download failure halts cloud-init
  # immediately with a clear error rather than silently producing a missing file.
  - |
    set -e
    mkdir -p /opt/decloud-relay/static /etc/decloud
    echo "[artifacts] Fetching required artifacts from node agent cache..."

    curl -f --max-time 30 ${ARTIFACT_URL:relay-api} \
      -o /opt/decloud-relay/relay-api.py
    chmod +x /opt/decloud-relay/relay-api.py
    echo "[artifacts] ✓ relay-api ($(wc -c < /opt/decloud-relay/relay-api.py) bytes)"

    curl -f --max-time 30 ${ARTIFACT_URL:relay-http-proxy} \
      -o /opt/decloud-relay/http-proxy.py
    chmod +x /opt/decloud-relay/http-proxy.py
    echo "[artifacts] ✓ relay-http-proxy"

    curl -f --max-time 30 ${ARTIFACT_URL:notify-nat-ready} \
      -o /usr/local/bin/notify-nat-ready.sh
    chmod +x /usr/local/bin/notify-nat-ready.sh
    echo "[artifacts] ✓ notify-nat-ready"

    curl -f --max-time 30 ${ARTIFACT_URL:relay-dashboard-html} \
      -o /opt/decloud-relay/static/dashboard.html
    curl -f --max-time 30 ${ARTIFACT_URL:relay-dashboard-css} \
      -o /opt/decloud-relay/static/dashboard.css
    curl -f --max-time 30 ${ARTIFACT_URL:relay-dashboard-js} \
      -o /opt/decloud-relay/static/dashboard.js
    echo "[artifacts] All artifacts fetched successfully"

  # ── Watcher artifacts ─────────────────────────────────────────────────────
  - |
    set -e
    echo "[artifacts] Fetching watcher artifacts..."
    curl -f --max-time 30 "${ARTIFACT_URL:decloud-env-watcher}" \
      -o /usr/local/bin/decloud-env-watcher.sh
    chmod +x /usr/local/bin/decloud-env-watcher.sh
    curl -f --max-time 30 "${ARTIFACT_URL:decloud-env-watcher-service}" \
      -o /etc/systemd/system/decloud-env-watcher@.service
    curl -f --max-time 30 "${ARTIFACT_URL:decloud-env-watcher-timer}" \
      -o /etc/systemd/system/decloud-env-watcher@.timer
    echo "[artifacts] ✓ watcher (script + service + timer)"

  # ── Initial environment-fetch ─────────────────────────────────────────────
  # Write a real generation hash so the watcher starts from a known baseline.
  # For Phase 3.1 (relay has no dynamics) the endpoint returns empty values;
  # this is present for consistency with DHT/BlockStore patterns.
  - |
    GATEWAY=$(ip route 2>/dev/null | awk '/default/ {print $3; exit}')
    mkdir -p /etc/decloud-relay
    ENV_RESP=$(curl -sf --max-time 5 \
        "http://${GATEWAY}:5100/api/obligations/relay/environment" 2>/dev/null || echo "")
    if [ -n "$ENV_RESP" ]; then
      GEN=$(echo "$ENV_RESP" | jq -r '.generation // "initial"')
      printf 'ENV_GENERATION=%s\n' "$GEN" > /etc/decloud-relay/environment
      echo "[env] Initial environment generation: ${GEN}"
    else
      echo "[env] Environment endpoint not yet reachable — keeping stub; watcher will update on first tick"
    fi

  - systemctl daemon-reload
  - systemctl enable decloud-relay-nat-callback.service
  - systemctl start decloud-relay-nat-callback.service
  - systemctl enable decloud-relay-register
  - systemctl start decloud-relay-register || true

  - ln -sf /etc/nginx/sites-available/relay-proxy /etc/nginx/sites-enabled/
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t
  - systemctl enable nginx
  - systemctl restart nginx

  - systemctl daemon-reload
  - systemctl enable decloud-relay-http-proxy
  - systemctl start decloud-relay-http-proxy
  - sleep 2
  - systemctl is-active decloud-relay-http-proxy || echo "WARNING - HTTP proxy failed to start"

  - systemctl enable decloud-relay-api
  - systemctl start decloud-relay-api
  - systemctl is-active decloud-relay-api || echo "WARNING - Relay API failed to start"

  - systemctl enable fail2ban
  - systemctl start fail2ban

  # ── Enable watcher timer ─────────────────────────────────────────────────
  # Fires decloud-env-watcher.sh relay every 60s starting 30s after boot.
  # Uses timers.target.wants/ symlink — consistent with the cloud-init symlink
  # pattern used for service units elsewhere in this file.
  - mkdir -p /etc/systemd/system/timers.target.wants
  - ln -sf /etc/systemd/system/decloud-env-watcher@.timer /etc/systemd/system/timers.target.wants/decloud-env-watcher@relay.timer
  - systemctl start decloud-env-watcher@relay.timer

  - 'echo "DeCloud relay VM bootstrap complete at $(date)" >> /var/log/decloud-relay-bootstrap.log'
  - 'echo "Relay ID: __VM_ID__" >> /var/log/decloud-relay-bootstrap.log'
  - 'echo "Relay Subnet: __RELAY_SUBNET__ (10.20.__RELAY_SUBNET__.0/24)" >> /var/log/decloud-relay-bootstrap.log'
  - 'echo "Tunnel IP: 10.20.__RELAY_SUBNET__.254" >> /var/log/decloud-relay-bootstrap.log'
  - 'echo "Region: __RELAY_REGION__" >> /var/log/decloud-relay-bootstrap.log'

final_message: "DeCloud Relay VM __VM_NAME__ is ready! Subnet: 10.20.__RELAY_SUBNET__.0/24, Gateway: 10.20.__RELAY_SUBNET__.254"