## DeCloud role layer: Coolify (self-hosted PaaS)
##
## Composed onto base-templates/base-tenant.yaml by TemplateComposer.
## The base layer owns the platform invariants — hostname, SSH password auth,
## chpasswd bootcmd, sshd drop-in, qemu-guest-agent package, the SSH CA, and
## the orchestrator-url file. This role layer carries ONLY the Coolify workload.
##
## Merge behaviour (TemplateComposer):
##   - write_files / runcmd   → ListConcat (base entries first, role after)
##   - packages               → ListUnion
##   - final_message          → ScalarRoleWins
##
## write_files DESIGN NOTES:
##
## 1. owner root:root on every entry. cloud-init's write_files runs during the
##    config stage, before any runcmd, before any non-default user exists.
##    Declaring a non-existent owner aborts the entire write_files list.
##
## 2. No heredocs inside write_files content blocks. A heredoc body at column 0
##    inside an indented YAML block scalar causes YAML linter errors (the bare
##    words look like mapping keys). Use printf in scripts; use write_files
##    entries for files that need to exist before runcmd runs.

write_files:

  # ── sshd drop-in: Docker bridge pubkey auth ───────────────────────────────
  # base-tenant.yaml sets TrustedUserCAKeys + AuthorizedPrincipalsFile (the
  # DeCloud SSH CA). This blocks plain pubkey auth — keys not signed by the CA
  # are rejected. Coolify's generated key is not CA-signed, so it would be
  # locked out of localhost SSH.
  #
  # This Match block exempts 10.0.0.0/8 (any Docker bridge subnet) so Coolify
  # can connect the moment its containers start. Written here (write_files =
  # cloud_config_modules stage) so it is on disk before setup.sh reloads sshd.
  - path: /etc/ssh/sshd_config.d/98-coolify-localhost.conf
    owner: root:root
    permissions: '0644'
    content: |
      # DeCloud/Coolify: allow plain pubkey auth from Docker bridge subnets.
      # The DeCloud CA + AuthorizedPrincipalsFile applies to all other connections.
      Match Address 10.0.0.0/8
          AuthorizedKeysFile .ssh/authorized_keys
          AuthorizedPrincipalsFile none

  # ── coolify-setup.sh ──────────────────────────────────────────────────────
  # Runs once at first boot via runcmd. Generates the admin credential, writes
  # it to disk, reloads sshd to pick up the drop-in above, then runs the
  # official Coolify installer with ROOT_USER_* env vars to pre-seed the admin
  # — closing the "first visitor becomes admin" security race.
  #
  # Uses printf (not heredoc) throughout. Heredoc terminators must be flush-left
  # in bash, but all content here is indented inside a YAML block scalar —
  # mixing the two causes either YAML parse errors or heredocs that never close.
  - path: /opt/decloud/coolify-setup.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      CRED_FILE="/opt/decloud/coolify-admin"
      log() { echo "[DeCloud/coolify] $*"; }

      mkdir -p /opt/decloud

      # ── Generate the instance admin credential ───────────────────────────
      # admin@coolify.local: plain domain that passes Coolify's email validator.
      # Hostname-derived .local addresses (e.g. admin@coolify-9c3e.coolify.local)
      # were rejected by RootUserSeeder, leaving the registration page open.
      ADMIN_USERNAME="admin"
      ADMIN_EMAIL="admin@example.com"
      # Generate password in two steps: subshell first, suffix second.
      # Single-expression concatenation fails when openssl runs in a
      # nested subshell inside printf — the suffix never appends.
      _RAND="$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9')"
      ADMIN_PASSWORD="${_RAND}Aa1#"

      # Write cred file via printf — no heredoc, no indentation ambiguity.
      umask 077
      printf '%s\n' \
        "DeCloud - Coolify instance admin" \
        "================================" \
        "Dashboard : https://__DECLOUD_DOMAIN__" \
        "Email     : ${ADMIN_EMAIL}" \
        "Username  : ${ADMIN_USERNAME}" \
        "Password  : ${ADMIN_PASSWORD}" \
        "" \
        "The public registration page is DISABLED - this admin was pre-created" \
        "at boot. Log in with the credentials above. Change the password from" \
        "Settings after first login if you wish." \
        > "${CRED_FILE}"
      chmod 600 "${CRED_FILE}"

      # ── Reload sshd to pick up 98-coolify-localhost.conf ────────────────
      # The drop-in was written by write_files (runs before runcmd), so it is
      # already on disk. Reload is sufficient — no restart needed.
      systemctl reload ssh
      log "sshd updated: Docker bridge pubkey auth enabled."

      # ── Install Coolify ──────────────────────────────────────────────────
      # Official one-liner. Installs Docker Engine 24+, curl/wget/git/jq/
      # openssl, sets up /data/coolify, and starts the Coolify containers.
      # Dashboard listens on :8000 (HTTP). Image pull takes ~2-5 minutes.
      log "Installing Coolify (pulls Docker + Coolify containers; ~2-5 min)..."
      env ROOT_USERNAME="${ADMIN_USERNAME}" \
          ROOT_USER_EMAIL="${ADMIN_EMAIL}" \
          ROOT_USER_PASSWORD="${ADMIN_PASSWORD}" \
          bash -c 'curl -fsSL https://cdn.coollabs.io/coolify/install.sh | bash'

      log "Coolify installed. Dashboard on :8000 (routed via CentralIngress)."
      log "Admin credentials saved to ${CRED_FILE}"

runcmd:
  # Start QEMU guest agent (static unit — systemctl enable fails silently on
  # the cloud image, so symlink directly; mirrors the validated Minecraft role).
  - ln -sf /lib/systemd/system/qemu-guest-agent.service /etc/systemd/system/multi-user.target.wants/qemu-guest-agent.service
  - systemctl start qemu-guest-agent

  # Install + configure Coolify.
  - bash /opt/decloud/coolify-setup.sh

# Role wins over base on final_message (TemplateComposer ScalarRoleWins).
final_message: |
  Coolify is installing!

  Dashboard: https://__DECLOUD_DOMAIN__
  First boot needs ~2-5 minutes to pull Docker + Coolify images.

  Your instance admin was pre-created (public registration is disabled).
  Retrieve the login credentials over SSH:

    ssh root@__HOSTNAME__            (password: see your DeCloud VM details)
    cat /opt/decloud/coolify-admin

  Then open the dashboard, connect a Git repo, and deploy your first app.

  Tip: in Coolify Settings, set the Instance Domain to your DeCloud subdomain
  to enable live deploy-log streaming and to serve your deployed apps with HTTPS.