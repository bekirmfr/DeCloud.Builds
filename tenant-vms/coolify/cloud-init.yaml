## DeCloud role layer: Coolify (self-hosted PaaS)
##
## Composed onto base-templates/base-tenant.yaml by TemplateComposer.
## The base layer owns the platform invariants — hostname, SSH password auth,
## chpasswd bootcmd, sshd drop-in, qemu-guest-agent package, the SSH CA, and
## the orchestrator-url file. This role layer carries ONLY the Coolify workload.
##
## Merge behaviour (TemplateComposer):
##   - write_files / runcmd   → ListConcat (base entries first, role after)
##   - packages               → ListUnion
##   - final_message          → ScalarRoleWins
##
## write_files DESIGN NOTES:
##
## 1. owner root:root on every entry. cloud-init's write_files runs during the
##    config stage, before any runcmd, before any non-default user exists.
##    Declaring a non-existent owner aborts the entire write_files list.
##
## 2. No heredocs inside write_files content blocks. A heredoc body at column 0
##    inside an indented YAML block scalar causes YAML linter errors (bare words
##    look like mapping keys). Use write_files entries for static file content.

write_files:

  # ── sshd drop-in: Docker bridge pubkey auth ───────────────────────────────
  # base-tenant.yaml sets TrustedUserCAKeys + AuthorizedPrincipalsFile (the
  # DeCloud SSH CA). This blocks plain pubkey auth — keys not signed by the CA
  # are rejected. Coolify's generated key is not CA-signed, so without this
  # drop-in it cannot SSH into localhost to manage the server.
  #
  # Match Address 10.0.0.0/8 covers any Docker bridge subnet assignment.
  # Written here (write_files = cloud_config_modules stage, before runcmd) so
  # sshd can be reloaded before the Coolify installer starts containers.
  - path: /etc/ssh/sshd_config.d/98-coolify-localhost.conf
    owner: root:root
    permissions: '0644'
    content: |
      # DeCloud/Coolify: allow plain pubkey auth from Docker bridge subnets.
      # The DeCloud CA + AuthorizedPrincipalsFile applies to all other connections.
      Match Address 10.0.0.0/8
          AuthorizedKeysFile .ssh/authorized_keys
          AuthorizedPrincipalsFile none

  # ── coolify-realtime.conf ─────────────────────────────────────────────────
  # nginx WebSocket location blocks. Proxies the two Coolify realtime channels
  # from the dashboard subdomain to the coolify-realtime container:
  #   /app/*        → :6001  (Reverb — dashboard live updates)
  #   /terminal/ws  → :6002  (terminal — in-browser server/app shell)
  #
  # WHY THIS IS NEEDED:
  # Stock Coolify exposes three ports — :8000 (dashboard nginx + Laravel),
  # :6001 (Reverb), and :6002 (terminal). Browsers connect to all three
  # directly. When CentralIngress fronts Coolify on a single subdomain, all
  # traffic flows through :8000, so nginx must split the WS paths off to the
  # realtime container. Coolify's stock nginx config has no such split —
  # /app/* and /terminal/ws fall through to Laravel and fail the WS upgrade
  # (dashboard shows the realtime-service warning; terminal never connects).
  #
  # Dropped into /etc/nginx/server-opts.d/ inside the coolify container by
  # coolify-fix-hosts.sh on every container start. server-opts.d is included
  # at server-block scope by both http.conf (after we add the include line
  # — see coolify-fix-hosts.sh) and https.conf.
  - path: /opt/decloud/coolify-realtime.conf
    owner: root:root
    permissions: '0644'
    content: |
      location /app/ {
          proxy_pass http://coolify-realtime:6001;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 86400s;
          proxy_send_timeout 86400s;
      }

      location /terminal/ws {
          proxy_pass http://coolify-realtime:6002;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 86400s;
          proxy_send_timeout 86400s;
      }

  # ── decloud-traefik-proxy.py ──────────────────────────────────────────────
  # Regenerates Traefik file-provider config for every app container that has
  # a Traefik HTTP host rule. Injects X-Forwarded-Proto: https so apps know
  # they are behind an HTTPS proxy (DeCloud terminates TLS at CentralIngress).
  # Called on every Docker container start so new Coolify deployments are
  # covered automatically without any manual step.
  #
  # WHY NEEDED:
  # Traefik's redirect-to-https middleware ignores X-Forwarded-Proto and
  # redirects unconditionally. PHP apps also redirect internally when
  # $_SERVER['HTTPS'] is unset. A file-provider router with higher priority
  # than the docker-provider router intercepts the request first and injects
  # the header, suppressing both redirects.
  #
  # WHY FILE PROVIDER, NOT LABEL OVERRIDE:
  # Traefik namespaces providers — redirect-to-https@docker cannot be
  # overridden from the @file provider. A new router at priority 1000
  # (docker auto-priority is rule-length-based, always lower) wins the
  # routing match before the docker router fires.
  - path: /opt/decloud/decloud-traefik-proxy.py
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      # Regenerate /data/coolify/proxy/dynamic/decloud-custom-domains.yaml for
      # every running app container that has a Traefik HTTP host router. Adds a
      # high-priority file-provider router that injects X-Forwarded-Proto: https
      # and routes straight to the container IP, suppressing both Traefik's
      # redirect-to-https middleware and the app's own internal HTTPS redirect.
      #
      # Pure Python (no shell heredoc) on purpose: cloud-init's write_files
      # parser treats a column-0 heredoc body inside a block scalar as new YAML
      # keys and rejects the whole user-data. Building the file in Python keeps
      # every line cleanly indented under "content: |".
      import json
      import re
      import subprocess
      import sys

      OUTPUT = "/data/coolify/proxy/dynamic/decloud-custom-domains.yaml"
      SKIP = {"coolify", "coolify-db", "coolify-redis", "coolify-realtime", "coolify-proxy"}
      RULE_RE = re.compile(r"traefik\.http\.routers\.(http-[^.]+)\.rule")

      def run(args):
          return subprocess.run(args, capture_output=True, text=True).stdout.strip()

      def main():
          ids = run(["docker", "ps", "-q"]).split()
          routers = {}
          services = {}
          for cid in ids:
              raw = run(["docker", "inspect", cid])
              if not raw:
                  continue
              info = json.loads(raw)[0]
              name = info.get("Name", "").lstrip("/")
              if name in SKIP:
                  continue
              nets = info.get("NetworkSettings", {}).get("Networks", {})
              ip = next((n.get("IPAddress") for n in nets.values() if n.get("IPAddress")), None)
              if not ip:
                  continue
              labels = info.get("Config", {}).get("Labels") or {}
              for key, val in labels.items():
                  m = RULE_RE.match(key)
                  if not m or "Host(" not in val:
                      continue
                  safe = "decloud-" + m.group(1)
                  routers[safe] = val
                  services[safe + "-svc"] = ip

          if not routers:
              try:
                  import os
                  os.remove(OUTPUT)
              except FileNotFoundError:
                  pass
              print("[decloud-traefik-proxy] No app containers found, config removed")
              return

          lines = ["http:", "  routers:"]
          for safe, rule in routers.items():
              lines += [
                  "    " + safe + ":",
                  "      entryPoints: [http]",
                  '      rule: "' + rule + '"',
                  "      service: " + safe + "-svc",
                  "      middlewares: [decloud-https-headers]",
                  "      priority: 1000",
              ]
          lines += [
              "  middlewares:",
              "    decloud-https-headers:",
              "      headers:",
              "        customRequestHeaders:",
              '          X-Forwarded-Proto: "https"',
              '          X-Forwarded-Ssl: "on"',
              "  services:",
          ]
          for svc, ip in services.items():
              lines += [
                  "    " + svc + ":",
                  "      loadBalancer:",
                  "        servers:",
                  "          - url: http://" + ip + ":80",
              ]

          tmp = OUTPUT + ".tmp"
          with open(tmp, "w") as fh:
              fh.write("\n".join(lines) + "\n")
          import os
          os.replace(tmp, OUTPUT)
          print("[decloud-traefik-proxy] Config written: %d router(s)" % len(routers))

      if __name__ == "__main__":
          main()

  # ── decloud-traefik-proxy.service ─────────────────────────────────────────
  # Event-driven systemd service. Watches all Docker container start/die
  # events and regenerates the Traefik file-provider config. Covers first
  # boot, reboots, Coolify app deploys, and container restarts — any event
  # that changes which app containers are running.
  - path: /etc/systemd/system/decloud-traefik-proxy.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Regenerate Traefik custom domain proxy config for DeCloud
      After=docker.service
      Requires=docker.service

      [Service]
      Type=simple
      ExecStart=/bin/sh -c 'docker events --filter event=start --filter event=die | while read -r line; do /usr/bin/python3 /opt/decloud/decloud-traefik-proxy.py; done'
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  # ── coolify-fix-hosts.sh ──────────────────────────────────────────────────
  # Applies in-container patches that don't survive Coolify upgrades. Despite
  # the historical name, this script now applies TWO patches:
  #
  #   1. host.docker.internal — repoint to the Coolify network bridge
  #      gateway in all four Coolify containers, so they can reach the
  #      host's sshd on Docker bridge subnets.
  #
  #   2. nginx /app/* location — drop coolify-realtime.conf into the
  #      coolify container's server-opts.d and ensure http.conf includes
  #      server-opts.d (Coolify's rendered http.conf is missing the include
  #      that http.conf.template carries). This makes Reverb's WebSocket
  #      reachable through the dashboard subdomain.
  #
  # WHY NOT A COMPOSE FILE PATCH:
  # Coolify's upgrade.sh re-downloads compose files from CDN before recreating
  # containers, overwriting any extra_hosts patch. /etc/hosts and the nginx
  # config inside the container are also reset on every recreation. This
  # script is called by the event-driven systemd service below, which fires
  # on every Coolify container start.
  - path: /opt/decloud/coolify-fix-hosts.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      # Apply in-container patches to Coolify containers. Called by
      # coolify-fix-hosts.service on every container start event.
      set -euo pipefail

      log() { echo "[coolify-fix-hosts] $*"; }

      CONTAINERS="coolify coolify-db coolify-redis coolify-realtime"

      # ─── Patch 1: host.docker.internal ───────────────────────────────────
      # Get the IPv4 gateway of the Coolify Docker network.
      GW=$(docker network inspect coolify \
          --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null \
          | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1)

      if [ -z "$GW" ]; then
          log "Coolify network not found yet, skipping"
          exit 0
      fi

      log "Patching host.docker.internal to $GW"

      for ctr in $CONTAINERS; do
          if docker inspect "$ctr" &>/dev/null; then
              docker exec -u root "$ctr" sh -c \
                  'cat /etc/hosts | sed "s/.*host\.docker\.internal.*/'$GW' host.docker.internal/" > /tmp/h && cat /tmp/h > /etc/hosts' \
                  && log "Patched hosts in $ctr" \
                  || log "Skipped hosts in $ctr (exec failed)"
          fi
      done

      # ─── Patch 2: nginx /app/* WebSocket proxy ───────────────────────────
      # Only the 'coolify' container runs nginx; the realtime proxy block
      # lives inside it, but proxies traffic OUT to coolify-realtime:6001.
      if docker inspect coolify &>/dev/null; then
          # Copy the location block into nginx server-opts.d.
          if docker cp /opt/decloud/coolify-realtime.conf \
              coolify:/etc/nginx/server-opts.d/coolify-realtime.conf 2>/dev/null; then
              log "Copied coolify-realtime.conf into nginx server-opts.d"
          else
              log "Failed to copy coolify-realtime.conf (continuing)"
          fi

          # Ensure http.conf loads server-opts.d (matches https.conf behaviour).
          # Idempotent: only appends the include line if not already present.
          # http.conf.template carries this line; Coolify's rendered http.conf
          # is missing it, so direct /:8080 traffic doesn't load server-opts.d.
          docker exec coolify sh -c '
              grep -q "include /etc/nginx/server-opts.d/" /etc/nginx/site-opts.d/http.conf \
                  || echo "include /etc/nginx/server-opts.d/*.conf;" >> /etc/nginx/site-opts.d/http.conf
          ' && log "Ensured server-opts.d include in http.conf"

          # Validate and reload nginx inside the container.
          if docker exec coolify nginx -t &>/dev/null; then
              docker exec coolify nginx -s reload \
                  && log "Reloaded nginx" \
                  || log "nginx reload failed"
          else
              log "nginx -t failed, refusing to reload"
          fi
      fi

      log "Done."

  # ── coolify-fix-hosts.service ─────────────────────────────────────────────
  # Event-driven systemd service. Watches Docker events and re-patches
  # host.docker.internal in Coolify containers whenever any container named
  # "coolify" starts. Covers first boot, reboots, Coolify upgrades, and
  # manual docker restart — any event that recreates containers and resets
  # their /etc/hosts.
  - path: /etc/systemd/system/coolify-fix-hosts.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Patch host.docker.internal in Coolify containers on start
      After=docker.service
      Requires=docker.service

      [Service]
      Type=simple
      ExecStart=/bin/sh -c 'docker events --filter event=start --filter name=coolify | while read -r line; do /opt/decloud/coolify-fix-hosts.sh; done'
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  # ── coolify-setup.sh ──────────────────────────────────────────────────────
  # Reloads sshd to activate the drop-in above, then runs the official
  # Coolify installer. No admin pre-seeding — Coolify's standard onboarding
  # form handles first-user creation on first dashboard visit, which is the
  # upstream-intended flow and simpler than generating credentials here.
  - path: /opt/decloud/coolify-setup.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      log() { echo "[DeCloud/coolify] $*"; }

      # Reload sshd to activate 98-coolify-localhost.conf (written by
      # write_files before this script runs). This must happen before the
      # installer starts Coolify containers so the Docker bridge pubkey
      # exemption is in place from the first connection attempt.
      systemctl reload ssh
      log "sshd updated: Docker bridge pubkey auth enabled."

      # Run the official Coolify installer.
      # Installs Docker Engine 24+, sets up /data/coolify, pulls and starts
      # all Coolify containers. Dashboard listens on :8000. Allow ~2-5 min.
      log "Installing Coolify (instance URL: https://__DECLOUD_DOMAIN__; ~2-5 min)..."
      curl -fsSL https://cdn.coollabs.io/coolify/install.sh | bash

      # ── APP_URL and Reverb WebSocket configuration ────────────────────────
      # Coolify's install.sh writes /data/coolify/source/.env from a template
      # that lacks APP_URL, PUSHER_HOST, PUSHER_PORT, PUSHER_SCHEME. With
      # those empty, Laravel falls back to http://localhost and the browser-
      # side Pusher client tries wss://localhost:6001 — which is the user's
      # own machine, not the VM. Livewire components await that handshake
      # forever and the dashboard renders as a perpetual black loading
      # screen. Append the right values to .env at the boundary the
      # installer itself uses, then restart Coolify so the new config takes
      # effect. sed -e '/^KEY=/d' first makes re-runs idempotent.
      DECLOUD_DOMAIN="__DECLOUD_DOMAIN__"
      ENV_FILE="/data/coolify/source/.env"
      log "Setting APP_URL and Reverb host in ${ENV_FILE}..."
      sed -i '/^APP_URL=/d;/^PUSHER_HOST=/d;/^PUSHER_PORT=/d;/^PUSHER_SCHEME=/d' "${ENV_FILE}"
      echo "APP_URL=https://${DECLOUD_DOMAIN}" >> "${ENV_FILE}"
      echo "PUSHER_HOST=${DECLOUD_DOMAIN}"     >> "${ENV_FILE}"
      echo "PUSHER_PORT=443"                   >> "${ENV_FILE}"
      echo "PUSHER_SCHEME=https"               >> "${ENV_FILE}"

      # Wait for Coolify's first-boot migrate+seed to finish before doing
      # anything that restarts the coolify container. The installer kicks off
      # migrations and the ProductionSeeder asynchronously after the container
      # starts; the seeder creates the InstanceSettings row (id 0) that every
      # request depends on. Restarting the container mid-seed aborts it and it
      # is never retried, leaving instance_settings empty — every route
      # (including /login) then 500s with "No query results for model
      # [InstanceSettings]", surfaced through nginx as a 404 error page.
      #
      # Poll InstanceSettings::count() rather than sleeping a fixed interval:
      # align to the boundary the app actually provides (settings row exists)
      # instead of guessing how long the seed takes. Bounded to ~5 min so a
      # genuinely broken install still fails instead of hanging forever.
      log "Waiting for Coolify first-boot migration+seed to complete..."
      seeded=0
      for i in $(seq 1 60); do
          count=$(docker exec coolify php artisan tinker \
              --execute="echo \App\Models\InstanceSettings::count();" 2>/dev/null \
              | tr -dc '0-9')
          if [ "${count:-0}" -ge 1 ]; then
              seeded=1
              log "InstanceSettings present after $((i*5))s — seed complete."
              break
          fi
          sleep 5
      done

      # Fallback: if the seed has not run after the timeout, run it explicitly.
      # migrate --force then ProductionSeeder is exactly what Coolify's own
      # first-boot does; running it again is idempotent (seeders use
      # firstOrCreate), so this is safe whether the async seed partially ran
      # or not at all.
      if [ "$seeded" -ne 1 ]; then
          log "Seed did not complete in time; running migrate+seed explicitly."
          docker exec coolify php artisan migrate --force || true
          docker exec coolify php artisan db:seed --class=ProductionSeeder --force || true
      fi

      # Restart only the containers that need to re-read .env. Laravel reads
      # .env at process start, so a container restart is sufficient — we are
      # not changing compose configuration, only application env.
      #
      # Use `docker restart` rather than `docker compose restart`: Coolify's
      # compose file contains a legacy 'soketi' service block kept as a
      # backward-compatibility alias (container_name: coolify-realtime) with
      # no image/build/profile. Docker Compose v2 strict validation rejects
      # this; `docker restart` operates by container name without touching
      # compose, so it is unaffected.
      log "Restarting Coolify containers to apply env changes..."
      docker restart coolify coolify-realtime

      # Apply in-container patches to the initial Coolify containers. The
      # event-driven watcher armed in the next step only fires on FUTURE
      # container start events, so we run the patch script once explicitly
      # here for the initial set started by the installer (hosts.docker.
      # internal repoint + nginx /app/* WebSocket proxy + nginx reload).
      log "Applying in-container patches to initial Coolify containers..."
      /opt/decloud/coolify-fix-hosts.sh

      # Arm the event-driven watcher for future container starts. Docker is
      # installed and docker.service is registered now, so Requires=docker.service
      # resolves cleanly. The runcmd-level `systemctl enable` already created
      # the boot-time symlink, so reboots are also covered.
      systemctl start coolify-fix-hosts.service
      log "coolify-fix-hosts service started."

      # Generate initial Traefik proxy config for any app containers already
      # running, then arm the event watcher for future deploys. At first boot
      # there are no app containers yet, so the script exits cleanly with no
      # output file — that is expected and correct.
      /usr/bin/python3 /opt/decloud/decloud-traefik-proxy.py || true
      systemctl start decloud-traefik-proxy.service
      log "decloud-traefik-proxy service started."

      log "Coolify installed. Dashboard on :8000 (routed via CentralIngress)."

runcmd:
  # Start QEMU guest agent (static unit — systemctl enable fails silently on
  # the cloud image, so symlink directly; mirrors the validated Minecraft role).
  - ln -sf /lib/systemd/system/qemu-guest-agent.service /etc/systemd/system/multi-user.target.wants/qemu-guest-agent.service
  - systemctl start qemu-guest-agent

  # Enable the event-driven fix services so they start on every boot.
  - systemctl enable coolify-fix-hosts.service
  - systemctl enable decloud-traefik-proxy.service

  # Install + configure Coolify.
  - bash /opt/decloud/coolify-setup.sh

# Role wins over base on final_message (TemplateComposer ScalarRoleWins).
final_message: |
  Coolify is installing!

  Dashboard: https://__DECLOUD_DOMAIN__
  First boot needs ~2-5 minutes to pull Docker + Coolify images.

  Open the dashboard and complete the one-time setup:
    1. Create your admin account (email + password of your choice)
    2. Choose "This Machine" as the server type
    3. Connect a Git repo and deploy your first app

  To make a deployed app reachable from the internet:
    Add a Custom Domain to this VM in the DeCloud dashboard and CNAME it
    to the platform's base domain. Use the same domain in Coolify's
    per-app settings — Coolify's Traefik will route it once DNS resolves.

  SSH access:
    ssh root@__HOSTNAME__    (password: see your DeCloud VM details)