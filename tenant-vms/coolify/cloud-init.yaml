## DeCloud role layer: Coolify (self-hosted PaaS)
##
## Composed onto base-templates/base-tenant.yaml by TemplateComposer.
## The base layer owns the platform invariants — hostname, SSH password auth,
## chpasswd bootcmd, sshd drop-in, qemu-guest-agent package, the SSH CA, and
## the orchestrator-url file. This role layer carries ONLY the Coolify workload.
##
## Merge behaviour (TemplateComposer):
##   - write_files / runcmd   → ListConcat (base entries first, role after)
##   - packages               → ListUnion
##   - final_message          → ScalarRoleWins
##
## write_files DESIGN NOTES:
##
## 1. owner root:root on every entry. cloud-init's write_files runs during the
##    config stage, before any runcmd, before any non-default user exists.
##    Declaring a non-existent owner aborts the entire write_files list.
##
## 2. No heredocs inside write_files content blocks. A heredoc body at column 0
##    inside an indented YAML block scalar causes YAML linter errors (bare words
##    look like mapping keys). Use write_files entries for static file content.

write_files:

  # ── sshd drop-in: Docker bridge pubkey auth ───────────────────────────────
  # base-tenant.yaml sets TrustedUserCAKeys + AuthorizedPrincipalsFile (the
  # DeCloud SSH CA). This blocks plain pubkey auth — keys not signed by the CA
  # are rejected. Coolify's generated key is not CA-signed, so without this
  # drop-in it cannot SSH into localhost to manage the server.
  #
  # Match Address 10.0.0.0/8 covers any Docker bridge subnet assignment.
  # Written here (write_files = cloud_config_modules stage, before runcmd) so
  # sshd can be reloaded before the Coolify installer starts containers.
  - path: /etc/ssh/sshd_config.d/98-coolify-localhost.conf
    owner: root:root
    permissions: '0644'
    content: |
      # DeCloud/Coolify: allow plain pubkey auth from Docker bridge subnets.
      # The DeCloud CA + AuthorizedPrincipalsFile applies to all other connections.
      Match Address 10.0.0.0/8
          AuthorizedKeysFile .ssh/authorized_keys
          AuthorizedPrincipalsFile none

  # ── coolify-fix-hosts.sh ──────────────────────────────────────────────────
  # Patches host.docker.internal in every Coolify container to point at the
  # Coolify network bridge gateway instead of docker0.
  #
  # WHY THIS IS NEEDED:
  # Docker sets host.docker.internal to the docker0 gateway (10.0.0.1) in ALL
  # containers, regardless of which network the container is on. Coolify runs
  # its containers on its own bridge network (gateway 10.0.1.1). Connections
  # from Coolify containers to 10.0.0.1:22 never reach sshd — silent failure.
  #
  # WHY NOT A COMPOSE FILE PATCH:
  # Coolify's upgrade.sh re-downloads compose files from CDN before recreating
  # containers, overwriting any extra_hosts patch. /etc/hosts inside a container
  # is also reset on every recreation. This script is called by the event-driven
  # systemd service below, which fires on every Coolify container start.
  - path: /opt/decloud/coolify-fix-hosts.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      # Patch host.docker.internal in Coolify containers to the correct bridge
      # gateway. Called by coolify-fix-hosts.service on every container start.
      set -euo pipefail

      CONTAINERS="coolify coolify-db coolify-redis coolify-realtime"

      # Get the IPv4 gateway of the Coolify Docker network.
      GW=$(docker network inspect coolify \
          --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}' 2>/dev/null \
          | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -1)

      if [ -z "$GW" ]; then
          echo "[coolify-fix-hosts] Coolify network not found yet, skipping"
          exit 0
      fi

      echo "[coolify-fix-hosts] Patching host.docker.internal to $GW"

      for ctr in $CONTAINERS; do
          if docker inspect "$ctr" &>/dev/null; then
              docker exec -u root "$ctr" sh -c \
                  'cat /etc/hosts | sed "s/.*host\.docker\.internal.*/'$GW' host.docker.internal/" > /tmp/h && cat /tmp/h > /etc/hosts' \
                  && echo "[coolify-fix-hosts] Patched $ctr" \
                  || echo "[coolify-fix-hosts] Skipped $ctr (exec failed)"
          fi
      done

      echo "[coolify-fix-hosts] Done."

  # ── coolify-fix-hosts.service ─────────────────────────────────────────────
  # Event-driven systemd service. Watches Docker events and re-patches
  # host.docker.internal in Coolify containers whenever any container named
  # "coolify" starts. Covers first boot, reboots, Coolify upgrades, and
  # manual docker restart — any event that recreates containers and resets
  # their /etc/hosts.
  - path: /etc/systemd/system/coolify-fix-hosts.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Patch host.docker.internal in Coolify containers on start
      After=docker.service
      Requires=docker.service

      [Service]
      Type=simple
      ExecStart=/bin/sh -c 'docker events --filter event=start --filter name=coolify | while read -r line; do /opt/decloud/coolify-fix-hosts.sh; done'
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  # ── coolify-setup.sh ──────────────────────────────────────────────────────
  # Reloads sshd to activate the drop-in above, then runs the official
  # Coolify installer. No admin pre-seeding — Coolify's standard onboarding
  # form handles first-user creation on first dashboard visit, which is the
  # upstream-intended flow and simpler than generating credentials here.
  - path: /opt/decloud/coolify-setup.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail

      log() { echo "[DeCloud/coolify] $*"; }

      # Reload sshd to activate 98-coolify-localhost.conf (written by
      # write_files before this script runs). This must happen before the
      # installer starts Coolify containers so the Docker bridge pubkey
      # exemption is in place from the first connection attempt.
      systemctl reload ssh
      log "sshd updated: Docker bridge pubkey auth enabled."

      # Run the official Coolify installer.
      # Installs Docker Engine 24+, sets up /data/coolify, pulls and starts
      # all Coolify containers. Dashboard listens on :8000. Allow ~2-5 min.
      log "Installing Coolify (instance URL: https://__DECLOUD_DOMAIN__; ~2-5 min)..."
      curl -fsSL https://cdn.coollabs.io/coolify/install.sh | bash

      # ── APP_URL and Reverb WebSocket configuration ────────────────────────
      # Coolify's install.sh writes /data/coolify/source/.env from a template
      # that lacks APP_URL, PUSHER_HOST, PUSHER_PORT, PUSHER_SCHEME. With
      # those empty, Laravel falls back to http://localhost and the browser-
      # side Pusher client tries wss://localhost:6001 — which is the user's
      # own machine, not the VM. Livewire components await that handshake
      # forever and the dashboard renders as a perpetual black loading
      # screen. Append the right values to .env at the boundary the
      # installer itself uses, then restart Coolify so the new config takes
      # effect. sed -e '/^KEY=/d' first makes re-runs idempotent.
      DECLOUD_DOMAIN="__DECLOUD_DOMAIN__"
      ENV_FILE="/data/coolify/source/.env"
      log "Setting APP_URL and Reverb host in ${ENV_FILE}..."
      sed -i '/^APP_URL=/d;/^PUSHER_HOST=/d;/^PUSHER_PORT=/d;/^PUSHER_SCHEME=/d' "${ENV_FILE}"
      echo "APP_URL=https://${DECLOUD_DOMAIN}" >> "${ENV_FILE}"
      echo "PUSHER_HOST=${DECLOUD_DOMAIN}"     >> "${ENV_FILE}"
      echo "PUSHER_PORT=443"                   >> "${ENV_FILE}"
      echo "PUSHER_SCHEME=https"               >> "${ENV_FILE}"

      # Restart only the containers that need to re-read .env. Laravel reads
      # .env at process start, so a container restart is sufficient — we are
      # not changing compose configuration, only application env.
      #
      # Use `docker restart` rather than `docker compose restart`: Coolify's
      # compose file contains a legacy 'soketi' service block kept as a
      # backward-compatibility alias (container_name: coolify-realtime) with
      # no image/build/profile. Docker Compose v2 strict validation rejects
      # this; `docker restart` operates by container name without touching
      # compose, so it is unaffected.
      log "Restarting Coolify containers to apply env changes..."
      docker restart coolify coolify-realtime

      # Patch the containers the installer just started. The event-driven
      # watcher we arm in the next step only fires on FUTURE container starts
      # (upgrades, manual docker restart). The initial set is already running
      # with docker0 as host.docker.internal, so patch once explicitly here.
      log "Patching host.docker.internal in initial Coolify containers..."
      /opt/decloud/coolify-fix-hosts.sh

      # Arm the event-driven watcher for future container starts. Docker is
      # installed and docker.service is registered now, so Requires=docker.service
      # resolves cleanly. The runcmd-level `systemctl enable` already created
      # the boot-time symlink, so reboots are also covered.
      systemctl start coolify-fix-hosts.service
      log "coolify-fix-hosts service started."

      log "Coolify installed. Dashboard on :8000 (routed via CentralIngress)."

runcmd:
  # Start QEMU guest agent (static unit — systemctl enable fails silently on
  # the cloud image, so symlink directly; mirrors the validated Minecraft role).
  - ln -sf /lib/systemd/system/qemu-guest-agent.service /etc/systemd/system/multi-user.target.wants/qemu-guest-agent.service
  - systemctl start qemu-guest-agent

  # Enable the event-driven fix service so it starts on every boot.
  - systemctl enable coolify-fix-hosts.service

  # Install + configure Coolify.
  - bash /opt/decloud/coolify-setup.sh

# Role wins over base on final_message (TemplateComposer ScalarRoleWins).
final_message: |
  Coolify is installing!

  Dashboard: https://__DECLOUD_DOMAIN__
  First boot needs ~2-5 minutes to pull Docker + Coolify images.

  Open the dashboard and complete the one-time setup:
    1. Create your admin account (email + password of your choice)
    2. Choose "This Machine" as the server type
    3. Connect a Git repo and deploy your first app

  To make a deployed app reachable from the internet:
    Add a Custom Domain to this VM in the DeCloud dashboard and CNAME it
    to the platform's base domain. Use the same domain in Coolify's
    per-app settings — Coolify's Traefik will route it once DNS resolves.

  SSH access:
    ssh root@__HOSTNAME__    (password: see your DeCloud VM details)