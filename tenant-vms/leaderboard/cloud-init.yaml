#cloud-config

# DeCloud Leaderboard Role Layer
#
# Composed with base-templates/base-tenant.yaml by TemplateComposer at seed time
# to form the `leaderboard` VmTemplate. base-tenant owns the platform invariants
# (hostname, root password, SSH password auth, sshd CA, qemu-guest-agent,
# curl/jq/openssl, orchestrator-url file, final_message). This layer carries ONLY
# the leaderboard workload. NOT deployed standalone.
#
# Delivery: the service ships as an inline data: URI Script artifact named
# "leaderboard" (constants generated into TenantVmTemplateSeeder.Artifacts.cs by
# tenant-vms/compute-artifact-constants.sh from assets/leaderboard-api.py). The
# node serves it SHA256-verified from the local artifact cache; runcmd fetches it
# the same way the general role layer fetches general-api.
#
# Substitution:
#   __VARNAME__              render-time, declared in TenantVmTemplateSeeder.BuildLeaderboardVariables()
#   ${ARTIFACT_URL:name}     artifact pipeline (VmService render Pass 2)
#   ${ARTIFACT_SHA256:name}
#
# YAML rule (compose convention): no column-0 heredocs in runcmd; static file
# content lives in write_files.

# python3 may need an apt refresh. base-tenant declares neither package_update nor
# package_upgrade, so this is role-exclusive (TemplateComposer ScalarExclusive).
package_update: true

packages:
  # qemu-guest-agent, curl, jq, openssl come from base-tenant (ListUnion dedupes).
  - python3

write_files:
  - path: /etc/leaderboard/leaderboard.env
    owner: root:root
    permissions: '0640'
    content: |
      PORT=8080
      DB_PATH=/var/lib/leaderboard/leaderboard.db
      ADMIN_TOKEN=__ADMIN_PASSWORD__

  - path: /etc/systemd/system/leaderboard.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=DeCloud Leaderboard Service
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=leaderboard
      Group=leaderboard
      EnvironmentFile=/etc/leaderboard/leaderboard.env
      WorkingDirectory=/opt/leaderboard
      ExecStart=/usr/bin/python3 /opt/leaderboard/leaderboard-api.py
      Restart=always
      RestartSec=5
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      ReadWritePaths=/var/lib/leaderboard
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target

  - path: /etc/motd
    owner: root:root
    permissions: '0644'
    content: |
      DeCloud Leaderboard Service
      ===========================
      Admin console : https://__DECLOUD_DOMAIN__/   (sign in with this VM's root password)
      Base URL      : https://__DECLOUD_DOMAIN__
      Health        : https://__DECLOUD_DOMAIN__/health

      The console (open the URL above) manages boards, apps, and access keys in
      the browser. The same admin actions work over curl by sending the deploy
      password as x-admin-token. The model: boards are project-wide (operator
      creates them); an app is just a label; an access KEY is a secret bound to
      one board with the rights you grant (submit, optionally member:delete).
        # 1) create a board (returns its board key)
        curl -s https://__DECLOUD_DOMAIN__/admin/boards \
          -H "x-admin-token: __ADMIN_PASSWORD__" \
          -d '{"name":"Daily","direction_method":"descending"}'
        # 2) create an app (label only, no secret)
        curl -s https://__DECLOUD_DOMAIN__/admin/apps \
          -H "x-admin-token: __ADMIN_PASSWORD__" -d '{"label":"my-game"}'
        # 3) issue a key for that board under the app (scopes default to submit)
        curl -s https://__DECLOUD_DOMAIN__/admin/apps/<APP_ID>/keys \
          -H "x-admin-token: __ADMIN_PASSWORD__" \
          -d '{"board_key":"<KEY>","scopes":["submit"]}'
      Submit scores from your server with the key secret:
        /leaderboards/<KEY>/submit   (header  x-session-token: <KEY_SECRET>)
      Public reads (board key only, no auth):
        /leaderboards/<KEY>/list?count=10
        /leaderboards/<KEY>/member/<MEMBER>?around=3

runcmd:
  # Dedicated unprivileged service account (created before the service starts).
  - id -u leaderboard >/dev/null 2>&1 || useradd --system --no-create-home --shell /usr/sbin/nologin leaderboard
  - mkdir -p /opt/leaderboard /var/lib/leaderboard
  # Fetch the service from the node-local artifact cache (general role pattern).
  - curl -f --max-time 30 "${ARTIFACT_URL:leaderboard}" -o /opt/leaderboard/leaderboard-api.py
  # Belt-and-suspenders: re-verify the SHA256 the node already checked.
  - echo "${ARTIFACT_SHA256:leaderboard}  /opt/leaderboard/leaderboard-api.py" | sha256sum -c -
  - chmod 0755 /opt/leaderboard/leaderboard-api.py
  - chown -R leaderboard:leaderboard /var/lib/leaderboard
  - chmod 0750 /var/lib/leaderboard
  # Static unit: systemctl enable unreliable on Debian (base-tenant uses the same
  # direct-symlink pattern for qemu-guest-agent), so symlink + start.
  - systemctl daemon-reload
  - ln -sf /etc/systemd/system/leaderboard.service /etc/systemd/system/multi-user.target.wants/leaderboard.service
  - systemctl start leaderboard
