# ============================================================
# Placement: .github/workflows/release-binaries.yml
# ============================================================
#
# Builds and releases the DeCloud system VM binaries:
#   dht-node-amd64, dht-node-arm64
#   blockstore-node-amd64, blockstore-node-arm64
#
# Trigger: push a tag of the form `binaries/vX.Y.Z`
#   git tag binaries/v1.0.0
#   git push origin binaries/v1.0.0
#
# This tag is intentionally separate from the application release
# tag (v*) so binary releases can be cut independently of the
# .NET application — binaries change on Go source changes;
# the application changes on C# source changes. Decoupled.
#
# Release assets (per binary, per architecture):
#   dht-node-amd64              raw ELF binary
#   dht-node-amd64.sha256       hex digest (64 chars + newline)
#   dht-node-arm64
#   dht-node-arm64.sha256
#   blockstore-node-amd64
#   blockstore-node-amd64.sha256
#   blockstore-node-arm64
#   blockstore-node-arm64.sha256
#
# The .sha256 files are what P10's TemplateSeederService reads to
# populate VmTemplate.Artifacts[].Sha256 at seeding time.
#
# Asset URLs follow the GitHub Releases convention:
#   https://github.com/{org}/{repo}/releases/download/binaries%2Fv1.0.0/dht-node-amd64
#
# ============================================================

name: Release system VM binaries

on:
  push:
    tags:
      - 'binaries/v*'

permissions:
  contents: write   # required to create releases and upload assets
  env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Build DHT node ──────────────────────────────────────────────────────────
  build-dht:
    name: Build dht-node (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            goarch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm   # GitHub-hosted ARM64 runner
            goarch: arm64

    defaults:
      run:
        working-directory: system-vms/dht/dht-node-src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: system-vms/dht/dht-node-src/go.sum

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go mod tidy
          go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -o dht-node-${{ matrix.arch }} \
            .

      - name: Compute SHA256
        run: |
          sha256sum dht-node-${{ matrix.arch }} \
            | awk '{print $1}' \
            > dht-node-${{ matrix.arch }}.sha256
          echo "SHA256: $(cat dht-node-${{ matrix.arch }}.sha256)"
          echo "Size:   $(stat -c%s dht-node-${{ matrix.arch }}) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dht-node-${{ matrix.arch }}
          path: |
            system-vms/dht/dht-node-src/dht-node-${{ matrix.arch }}
            system-vms/dht/dht-node-src/dht-node-${{ matrix.arch }}.sha256
          retention-days: 1

  # ── Build BlockStore node ────────────────────────────────────────────────────
  build-blockstore:
    name: Build blockstore-node (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            goarch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            goarch: arm64

    defaults:
      run:
        working-directory: system-vms/blockstore/blockstore-node-src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: system-vms/blockstore/blockstore-node-src/go.sum

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go mod tidy
          go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -o blockstore-node-${{ matrix.arch }} \
            .

      - name: Compute SHA256
        run: |
          sha256sum blockstore-node-${{ matrix.arch }} \
            | awk '{print $1}' \
            > blockstore-node-${{ matrix.arch }}.sha256
          echo "SHA256: $(cat blockstore-node-${{ matrix.arch }}.sha256)"
          echo "Size:   $(stat -c%s blockstore-node-${{ matrix.arch }}) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockstore-node-${{ matrix.arch }}
          path: |
            system-vms/blockstore/blockstore-node-src/blockstore-node-${{ matrix.arch }}
            system-vms/blockstore/blockstore-node-src/blockstore-node-${{ matrix.arch }}.sha256
          retention-days: 1

  # ── Create GitHub Release ────────────────────────────────────────────────────
  release:
    name: Create release
    runs-on: ubuntu-24.04
    needs: [build-dht, build-blockstore]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List dist contents
        run: ls -lh dist/

      - name: Verify all expected files present
        run: |
          EXPECTED=(
            dht-node-amd64
            dht-node-amd64.sha256
            dht-node-arm64
            dht-node-arm64.sha256
            blockstore-node-amd64
            blockstore-node-amd64.sha256
            blockstore-node-arm64
            blockstore-node-arm64.sha256
          )
          for f in "${EXPECTED[@]}"; do
            if [ ! -f "dist/$f" ]; then
              echo "MISSING: dist/$f"
              exit 1
            fi
            echo "OK: dist/$f"
          done

      - name: Build release notes
        id: notes
        run: |
          VERSION="${{ github.ref_name }}"
          TAG_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION//\//%2F}"

          {
            echo "## DeCloud System VM Binaries — ${VERSION}"
            echo ""
            echo "### Asset URLs and SHA256 digests"
            echo ""
            echo "Copy these into \`TemplateSeederService\` for P10."
            echo ""
            echo "| Binary | Architecture | SHA256 | URL |"
            echo "|--------|-------------|--------|-----|"
            for binary in dht-node blockstore-node; do
              for arch in amd64 arm64; do
                sha=$(cat dist/${binary}-${arch}.sha256)
                url="${TAG_URL}/${binary}-${arch}"
                echo "| \`${binary}\` | \`${arch}\` | \`${sha}\` | [download](${url}) |"
              done
            done
            echo ""
            echo "### What changed"
            echo ""
            git log --oneline $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD \
              -- \
              'system-vms/dht/dht-node-src/**' \
              'system-vms/blockstore/blockstore-node-src/**' \
              2>/dev/null | head -20 || echo "_First release._"
          } > release-notes.md

          cat release-notes.md
          echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "System VM Binaries ${{ github.ref_name }}"
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/dht-node-amd64
            dist/dht-node-amd64.sha256
            dist/dht-node-arm64
            dist/dht-node-arm64.sha256
            dist/blockstore-node-amd64
            dist/blockstore-node-amd64.sha256
            dist/blockstore-node-arm64
            dist/blockstore-node-arm64.sha256
